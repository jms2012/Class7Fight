                    ctx.strokeStyle = 'rgba(46, 204, 113, 0.5)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius + 8, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                if (char.isAssaulting && char.name === '陈治宏') {
                    const pulse = Math.sin(visualClock / 100) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(255, 242, 0, ${pulse * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius + 15, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = `rgba(255, 242, 0, ${pulse})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius + 12, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                if (char.name === '九氧化一磷') {
                    for (const trail of char.chargeTrail || []) {
                        ctx.fillStyle = `rgba(223,255,0,${(trail.life / 0.3) * 0.35})`;
                        ctx.fillRect(
                            trail.x - char.x - char.radius * 0.5,
                            trail.y - char.y - char.radius * 0.5,
                            char.radius,
                            char.radius
                        );
                    }
                    
                    if (char.chargeState === 'windup') {
                        const progress = Math.min(1, (Date.now() - char.chargePhaseStart) / (char.chargeWindupDuration / gameSpeed));
                        ctx.strokeStyle = 'rgba(241,196,15,0.9)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, char.radius + 10, 0, Math.PI * 2);
                        ctx.stroke();
                        
                        ctx.strokeStyle = 'rgba(241,196,15,0.55)';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(char.chargeAngle) * (char.radius + 70), Math.sin(char.chargeAngle) * (char.radius + 70));
                        ctx.stroke();
                        ctx.setLineDash([]);
                        
                        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, char.radius + 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
                        ctx.stroke();
                    }
                    
                    if (char.chargeState === 'dash') {
                        ctx.strokeStyle = 'rgba(223,255,0,0.9)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, char.radius + 10, 0, Math.PI * 2);
                        ctx.stroke();
                        
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(char.chargeAngle) * (char.radius + 26), Math.sin(char.chargeAngle) * (char.radius + 26));
                        ctx.stroke();
                    }
                    
                    if (char.chargeFx > 0) {
                        const progress = 1 - char.chargeFx / 0.3;
                        ctx.strokeStyle = `rgba(255,255,255,${1 - progress})`;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(0, 0, char.radius + 30 * progress, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                
                if (char.name === 'Liberty' && char.isCloaked) {
                    ctx.strokeStyle = 'rgba(155,89,182,0.85)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius + 9, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    if (char.cloakFx > 0) {
                        const progress = 1 - char.cloakFx / 0.5;
                        ctx.strokeStyle = `rgba(155,89,182,${1 - progress})`;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, char.radius + 10 + 90 * progress, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                
                if (char.isRedHot) {
                    ctx.fillStyle = 'rgba(231,76,60,0.18)';
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius * 1.15, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(231,76,60,0.9)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius * 1.15, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                if (char.name === '糖水') {
                    if (char.slashFx > 0) {
                        const progress = 1 - char.slashFx / 0.25;
                        const current = char.slashAngle - 0.6 + progress * 1.2;
                        const slashRange = char.slashRange || 45;
                        
                        ctx.strokeStyle = `rgba(230,126,34,${1 - progress})`;
                        ctx.lineWidth = 5;
                        ctx.beginPath();
                        ctx.arc(0, 0, slashRange * 0.9, char.slashAngle - 0.6, char.slashAngle + 0.6);
                        ctx.stroke();
                        
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(current) * slashRange, Math.sin(current) * slashRange);
                        ctx.stroke();
                    }
                    
                    for (const trail of char.dashTrail || []) {
                        ctx.fillStyle = `rgba(230,126,34,${(trail.life / 0.28) * 0.35})`;
                        ctx.fillRect(
                            trail.x - char.x - char.radius * 0.5,
                            trail.y - char.y - char.radius * 0.5,
                            char.radius,
                            char.radius
                        );
                    }
                    
                    if (char.armorTimer > 0) {
                        ctx.fillStyle = 'rgba(241,196,15,0.35)';
                        ctx.beginPath();
                        ctx.arc(0, 0, char.radius * 0.95, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.strokeStyle = 'rgba(241,196,15,0.9)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
                ctx.restore();
                }
            }
            
            for (const ft of floatingTexts) {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
            
            for (const char of characters) {
                if (char.hp <= 0) continue;
                // 变身中的模仿者由 currentForm.draw() 负责绘制名字/血量/蓄力条，避免重复绘制
                if (char.currentForm && char.isTransforming) continue;
                
                const nameY = char.y - char.radius - 5;
                const hpY = char.y - char.radius - 15;
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(char.name, char.x, nameY);
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Arial';
                ctx.fillText(`${Math.round(char.hp)}/${char.maxHp}`, char.x, hpY);
                
                // 邓杰的算式字幕（伤害数值即算式的计算结果，逐字敲出）
                if (char.isTyping && char.currentExpression) {
                    const typedText = char.currentExpression.substring(0, char.typingIndex + 1);
                    ctx.fillStyle = '#8e44ad';
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText(typedText + '|', char.x, char.y - char.radius - 26);
                } else if (char.expression && char.expressionRemain > 0) {
                    ctx.fillStyle = '#8e44ad';
                    ctx.font = 'bold 9px Arial';
                    ctx.fillText(char.expression, char.x, char.y - char.radius - 26);
                }
                
                if (char.chargeLevel !== undefined && char.maxCharge !== undefined) {
                    const chargeWidth = 40;
                    const chargeHeight = 6;
                    const chargeY = char.y - char.radius - 30;
                    
                    ctx.fillStyle = '#ddd';
                    ctx.fillRect(char.x - chargeWidth/2, chargeY, chargeWidth, chargeHeight);
                    ctx.fillStyle = '#f39c12';
                    ctx.fillRect(char.x - chargeWidth/2, chargeY, chargeWidth * (char.chargeLevel / char.maxCharge), chargeHeight);
                    
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText(`${char.chargeLevel}/${char.maxCharge}`, char.x, chargeY + 5);
                }
                
                if (char.bugCount && char.bugCount > 0) {
                    const bugY = char.y - char.radius - 30;
                    ctx.fillStyle = '#9b59b6';
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText(`漏洞: ${char.bugCount}`, char.x, bugY);
                }
                
                if (char.questions && char.questions > 0) {
                    const questionY = char.y - char.radius - 30;
                    ctx.fillStyle = '#00ffff';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('?' + '?'.repeat(char.questions - 1), char.x, questionY);
                }
                
                if (char.oxidationStacks > 0) {
                    ctx.fillStyle = '#9acd32';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`氧化 ${char.oxidationStacks}/5`, char.x, char.y - char.radius - 30);
                }
                
                if (char.viscousStacks > 0) {
                    ctx.fillStyle = '#d68910';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`黏稠 ${char.viscousStacks}/5`, char.x, char.y - char.radius - 42);
                }
                
                if (char.name === 'Liberty' && char.isCloaked) {
                    const remain = char.cloakRemain || 0;
                    ctx.fillStyle = 'rgba(155,89,182,1)';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`隐身 ${remain.toFixed(1)}s`, char.x, char.y - char.radius - 30);
                }
                
                if (char.sugarStacks > 0) {
                    ctx.fillStyle = '#e67e22';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`糖渍 ${char.sugarStacks}/4`, char.x, char.y - char.radius - 42);
                }
                
                if (char.isNagged) {
                    const nagY = char.y - char.radius - 45;
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('...', char.x, nagY);
                }
                
                if (char.isTyping && char.currentTypingCode) {
                    const typedText = char.currentTypingCode.substring(0, char.typingIndex + 1);
                    ctx.fillStyle = char.color;
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(typedText + '|', char.x, char.y - char.radius - 50);
                }
                
                // 陈智虫专属 UI：普通角色不走自身的 draw()，故在此统一绘制学习进度与状态
                if (char.name === '陈智虫') {
                    const learnY = char.y + char.radius + 14;
                    ctx.fillStyle = '#2ecc71';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`学${char.learnCount} 伤+${char.learnDamage}`, char.x, learnY);
                    
                    ctx.fillStyle = char.isLearning ? '#9b59b6' : '#e74c3c';
                    ctx.fillText(char.isLearning ? '学习中' : '战斗!', char.x, learnY + 12);
                }
                
                if (char.name === '班草') {
                    const petY = char.y - char.radius - 30;
                    ctx.fillStyle = char.summonUnlocked ? '#27ae60' : '#95a5a6';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(char.summonUnlocked ? `带班 ${char.alivePetCount()}/3` : '待收服', char.x, petY);
                }
            }
            
            if (immersiveMode) {
                ctx.restore();
            }
        }
        
        function update() {
            if (gameOver) return;
            
            // 仅供绘制层使用的动画时钟：暂停/结算时不再推进，外观特效随之一同冻结
            visualClock += gameSpeed * deltaTime * 1000;
            
            for (const char of characters) {
                if (char.hp <= 0) continue;
                
                // 人数补偿永久生效：变身/补兵/克隆产生的新形态也每帧兜底套用
                applyMatchHandicap(char);
                if (char.currentForm) applyMatchHandicap(char.currentForm);
                
                if (char.timeFieldEffect > 0) {
                    char.timeFieldEffect -= gameSpeed * deltaTime;
                }
                
                if (char.damageReduction > 0) {
                    char.damageReduction -= gameSpeed * deltaTime;
                }
                
                if (char.bugTimer && char.bugTimer > 0) {
                    char.bugTimer -= gameSpeed * deltaTime;
                    if (char.bugTimer <= 0) {
                        char.bugCount = Math.max(0, (char.bugCount || 0) - 1);
                        if (char.bugCount > 0) {
                            char.bugTimer = 10;
                        } else {
                            char.bugTimer = 0;
                        }
                    }
                }
                
                if (char.slowTimer && char.slowTimer > 0) {
                    char.slowTimer -= gameSpeed * deltaTime;
                    if (!char.slowApplied) {
                        char.slowApplied = true;
                        char.vx = char.vx * 0.5;
                        char.vy = char.vy * 0.5;
                        normalizeVelocity(char);
                    }
                    if (char.slowTimer <= 0) {
                        char.slowTimer = 0;
                        char.slowApplied = false;
                        char.vx = char.vx / 0.5;
                        char.vy = char.vy / 0.5;
                        normalizeVelocity(char);
                    }
                } else {
                    char.slowApplied = false;
                }
                
                if (char.stunTimer && char.stunTimer > 0) {
                    char.stunTimer -= gameSpeed * deltaTime;
                    char.vx = 0;
                    char.vy = 0;
                    if (char.stunTimer <= 0) {
                        char.stunTimer = 0;
                        const angle = Math.random() * Math.PI * 2;
                        char.vx = Math.cos(angle) * (char.speed || BASE_SPEED);
                        char.vy = Math.sin(angle) * (char.speed || BASE_SPEED);
                    }
                }
                
                if (char.punishTimer && char.punishTimer > 0) {
                    char.punishTimer -= gameSpeed * deltaTime;
                    
                    if (char.punishTarget && char.punishTarget.hp > 0) {
                        const orbitRadius = 80;
                        const moveDist = (char.speed || BASE_SPEED) * 1.5 * gameSpeed * deltaTime * 60;
                        const angleIncrement = moveDist / orbitRadius;
                        char.punishStartAngle += angleIncrement;
                        
                        const newX = char.punishTarget.x + Math.cos(char.punishStartAngle) * orbitRadius;
                        const newY = char.punishTarget.y + Math.sin(char.punishStartAngle) * orbitRadius;
                        
                        char.x = newX;
                        char.y = newY;
                        clampToBounds(char);
                        
                        const actualDx = char.x - char.punishLastX;
                        const actualDy = char.y - char.punishLastY;
                        const actualMoveDist = Math.min(
                            Math.sqrt(actualDx * actualDx + actualDy * actualDy),
                            moveDist
                        );
                        
                        char.punishLastX = char.x;
                        char.punishLastY = char.y;
                        char.vx = 0;
                        char.vy = 0;
                        
                        char.punishRunDistance += actualMoveDist;
                        
                        while (char.punishRunDistance >= 60) {
                            char.punishRunDistance -= 60;
                            const damage = 30;
                            char.hp -= damage;
                            showDamageText(char, damage, '#e74c3c', char.punishTarget);
                            if (char.hp <= 0) {
                                char.hp = 0;
                            }
                        }
                    }
                    
                    if (char.punishTimer <= 0) {
                        char.punishTimer = 0;
                        char.punishTarget = null;
                        char.punishStartAngle = 0;
                        char.punishRunDistance = 0;
                        char.punishLastX = 0;
                        char.punishLastY = 0;
                        const angle = Math.random() * Math.PI * 2;
                        char.vx = Math.cos(angle) * (char.speed || BASE_SPEED);
                        char.vy = Math.sin(angle) * (char.speed || BASE_SPEED);
                    }
                }
            }
            
            for (const char of characters) {
                // 罚跑压制：被罚跑的角色攻击与技能的使用速度下降
                if (char.punishTimer > 0) {
                    const savedGameSpeed = gameSpeed;
                    gameSpeed = savedGameSpeed * PUNISH_ACTION_SPEED_FACTOR;
                    char.update(characters, projectiles, floatingTexts);
                    gameSpeed = savedGameSpeed;
                } else {
                    char.update(characters, projectiles, floatingTexts);
                }
            }
            
            resolveSameTeamCollisions();
            
            const questionNow = Date.now();
            for (const char of characters) {
                if (char.hp <= 0) continue;
                
                if (char.questions && char.questions > 0) {
                    if (questionNow - char.lastQuestionTime >= 2000 / gameSpeed) {
                        const damage = char.questions * 15;
                        char.hp -= damage;
                        
                        const owner = characters.find(c => c.name === '陈智虫' && c.team !== char.team && c.hp > 0);
                        showDamageText(char, damage, '#9b59b6', owner || null);
                        
                        if (owner) {
                            const healAmount = Math.min(damage * 0.5, owner.maxHp - owner.hp);
                            if (healAmount > 0) {
                                owner.hp += healAmount;
                                showDamageText(owner, -healAmount, '#2ecc71', owner);
                            }
                        }
                        
                        char.lastQuestionTime = questionNow;
                    }
                }
                
                if (char.isNagged && questionNow < char.nagEndTime) {
                    if (questionNow - char.lastNagDirectionChange >= 500 / gameSpeed) {
                        char.vx *= -1;
                        char.vy *= -1;
                        char.lastNagDirectionChange = questionNow;
                    }
                } else {
                    char.isNagged = false;
                }
                
                // 氧化侵蚀：每层每秒造成 4 点伤害；每 2 秒缓慢衰减 1 层
                if (char.oxidationStacks > 0) {
                    const tickNow = Date.now();
                    if (tickNow - (char.lastOxidationTick || 0) >= 1000 / gameSpeed) {
                        char.lastOxidationTick = tickNow;
                        const dotDamage = char.oxidationStacks * 4;
                        char._hpBefore = char.hp;
                        char.hp -= dotDamage;
                        if (char.hp < 0) char.hp = 0;
                        showDamageText(char, dotDamage, '#e74c3c', char.oxidationSource || null);
                    }
                    
                    if (tickNow - (char.lastOxidationDecay || 0) >= 2000 / gameSpeed) {
                        char.lastOxidationDecay = tickNow;
                        char.oxidationStacks = Math.max(0, char.oxidationStacks - 1);
                        if (char.oxidationStacks <= 0) {
                            char.lastOxidationTick = 0;
                            char.lastOxidationDecay = 0;
                        }
                    }
                }
                
                // 黏稠：每层每秒 4 点伤害；层数存在期间持续 50% 减速；每 2 秒衰减 1 层
                if (char.viscousStacks > 0) {
                    const vtNow = Date.now();
                    char.slowTimer = Math.max(char.slowTimer || 0, 1.2);
                    
                    if (vtNow - (char.lastViscousTick || 0) >= 1000 / gameSpeed) {
                        char.lastViscousTick = vtNow;
                        const dotDamage = char.viscousStacks * 4;
                        char._hpBefore = char.hp;
                        char.hp -= dotDamage;
                        if (char.hp < 0) char.hp = 0;
                        showDamageText(char, dotDamage, '#e74c3c', char.viscousSource || null);
                    }
                    
                    if (vtNow - (char.lastViscousDecay || 0) >= 2000 / gameSpeed) {
                        char.lastViscousDecay = vtNow;
                        char.viscousStacks = Math.max(0, char.viscousStacks - 1);
                        if (char.viscousStacks <= 0) {
                            char.lastViscousTick = 0;
                            char.lastViscousDecay = 0;
                        }
                    }
                }
                
                // 糖渍：每层每秒 3 点伤害；4 秒内未被刷新则消散
                if (char.sugarStacks > 0) {
                    const sugarNow = Date.now();
                    if (sugarNow - (char.lastSugarTick || 0) >= 1000 / gameSpeed) {
                        char.lastSugarTick = sugarNow;
                        const sugarDamage = char.sugarStacks * 3;
                        char._hpBefore = char.hp;
                        char.hp -= sugarDamage;
                        if (char.hp < 0) char.hp = 0;
                        showDamageText(char, sugarDamage, '#e74c3c', char.sugarSource || null);
                    }
                    
                    if (sugarNow - (char.lastSugarStackTime || 0) >= 4000 / gameSpeed) {
                        char.sugarStacks = 0;
                        char.lastSugarTick = 0;
                        char.lastSugarStackTime = 0;
                    }
                }
            }
            
            for (const proj of projectiles) {
                if (proj.type === 'laser') {
                    proj.life -= gameSpeed * deltaTime;
                    
                    const angle = Math.atan2(proj.targetY - proj.y, proj.targetX - proj.x);
                    const cos = Math.cos(angle);
                    const sin = Math.sin(angle);
                    
                    for (const char of characters) {
                        if (char === proj.owner || char.hp <= 0 || char.team === proj.owner.team) continue;
                        
                        const dx = char.x - proj.x;
                        const dy = char.y - proj.y;
                        const perpDist = Math.abs(dx * sin - dy * cos);
                        const alongDist = dx * cos + dy * sin;
                        
                        if (perpDist < char.radius + proj.width / 2 && alongDist >= -char.radius && alongDist <= 2000) {
                            if (!char.laserHit || char.laserHit !== proj) {
                                const result = char.takeDamage(proj.damage, proj.owner, floatingTexts);
                                showDamageText(char, result.damage, '#e74c3c', proj.owner);
                                applyViscousStacks(proj.owner, char, result.damage, floatingTexts);
                                char.laserHit = proj;
                            }
                        }
                        
                        if (char.splits) {
                            for (let j = 0; j < char.splits.length; j++) {
                                const split = char.splits[j];
                                const sdx = split.x - proj.x;
                                const sdy = split.y - proj.y;
                                const sPerpDist = Math.abs(sdx * sin - sdy * cos);
                                const sAlongDist = sdx * cos + sdy * sin;
                                
                                if (sPerpDist < char.radius * 0.7 + proj.width / 2 && sAlongDist >= -char.radius * 0.7 && sAlongDist <= 2000) {
                                    if (!split.laserHit || split.laserHit !== proj) {
                                        split.hp -= proj.damage;
                                        showDamageText({ x: split.x, y: split.y }, proj.damage, '#e74c3c', proj.owner);
                                        if (split.hp <= 0) {
                                            char.splits.splice(j, 1);
                                            j--;
                                            continue;
                                        }
                                        split.laserHit = proj;
                                    }
                                } else if (split.laserHit === proj) {
                                    split.laserHit = null;
                                }
                            }
                        }
                    }
                    
                    if (proj.life <= 0) {
                        for (const char of characters) {
                            if (char.laserHit === proj) {
                                char.laserHit = null;
                            }
                            if (char.splits) {
                                for (const split of char.splits) {
                                    if (split.laserHit === proj) {
                                        split.laserHit = null;
                                    }
                                }
                            }
                        }
                    }
                } else if (proj.type === 'chalk') {
                    proj.x += proj.vx * gameSpeed * deltaTime * 60;
                    proj.y += proj.vy * gameSpeed * deltaTime * 60;
                    
                    if (proj.x < PADDING || proj.x > WIDTH - PADDING ||
                        proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                        proj.active = false;
                        if (proj.owner && proj.owner.name === '白蛋') {
                            proj.owner.comboCount = 0;
                        }
                        continue;
                    }
                    
                    let hit = false;
                    for (const char of characters) {
                        if (char.hp <= 0) continue;
                        const isOwner = char === proj.owner;
                        // 队友整体跳过（保持原有免疫）；自己只跳过本体，分身另行判断
                        if (!isOwner && proj.owner && char.team === proj.owner.team) continue;

                        }
                    } else {
                        if (proj.x < PADDING || proj.x > WIDTH - PADDING ||
                            proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                            proj.life = 0;
                            proj.active = false;
                            continue;
                        }
                    }
                    
                    if (!proj.currentHitTargets) proj.currentHitTargets = [];
                    
                    const stillHitting = [];
                    
                    for (const char of characters) {
                        if (char === proj.owner || char.hp <= 0 || (proj.owner && char.team === proj.owner.team)) continue;
                        
                        const isColliding = checkCircleSquareCollision(proj.x, proj.y, proj.radius, char.x, char.y, char.radius);
                        
                        if (isColliding) {
                            stillHitting.push(char);
                            
                            if (!proj.currentHitTargets.includes(char)) {
                                const result = char.takeDamage(proj.damage, proj.owner, floatingTexts);
                                showDamageText(char, result.damage, '#e74c3c', proj.owner);
                                proj.currentHitTargets.push(char);
                                proj.damage = Math.floor(proj.damage * 0.7);
                                
                                if (char.questions && char.questions > 0) {
                                    char.questions--;
                                }
                                
                                if (proj.currentHitTargets.length >= (proj.maxPenetrate || 3)) {
                                    proj.life = 0;
                                    proj.active = false;
                                    break;
                                }
                            }
                        }
                        
                        if (char.splits) {
                            for (let j = 0; j < char.splits.length; j++) {
                                const split = char.splits[j];
                                const splitColliding = checkCircleSquareCollision(proj.x, proj.y, proj.radius, split.x, split.y, char.radius * 0.7);
                                
                                if (splitColliding) {
                                    // 分身不消耗穿透次数、也不衰减伤害：子弹必须穿透分身继续飞行
                                    if (!split.bulletHits) split.bulletHits = [];
                                    if (!split.bulletHits.includes(proj)) {
                                        split.hp -= proj.damage;
                                        showDamageText({ x: split.x, y: split.y }, proj.damage, '#e74c3c', proj.owner);
                                        if (split.hp <= 0) {
                                            char.splits.splice(j, 1);
                                            j--;
                                            continue;
                                        }
                                        split.bulletHits.push(proj);
                                    }
                                } else if (split.bulletHits && split.bulletHits.includes(proj)) {
                                    split.bulletHits = split.bulletHits.filter(p => p !== proj);
                                }
                            }
                        }
                    }
                    
                    proj.currentHitTargets = stillHitting;
                } else if (proj.type === 'punish') {
                    proj.x += proj.vx * gameSpeed * deltaTime * 60;
                    proj.y += proj.vy * gameSpeed * deltaTime * 60;
                    proj.life -= gameSpeed * deltaTime;
                    
                    if (proj.x < PADDING || proj.x > WIDTH - PADDING ||
                        proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                        proj.life = 0;
                        continue;
                    }
                    
                    if (!proj.hit) {
                        for (const char of characters) {
                            if (char === proj.owner || char.hp <= 0 || (proj.owner && char.team === proj.owner.team)) continue;
                            
                            if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, char.x, char.y, char.radius)) {
                                char.punishTimer = 6;
                                char.punishTarget = proj.owner;
                                char.punishStartAngle = Math.random() * Math.PI * 2;
                                char.stunTimer = 0.5;
                                char.punishRunDistance = 0;
                                char.punishLastX = char.x;
                                char.punishLastY = char.y;
                                
                                floatingTexts.push({
                                    x: char.x,
                                    y: char.y - 25,
                                    text: '罚跑!',
                                    color: '#e74c3c',
                                    alpha: 1,
                                    vy: -0.5,
                                    life: 1,
                                    initialLife: 1
                                });
                                
                                proj.hit = true;
                                proj.life = 0;
                                break;
                            }
                            
                            if (char.splits) {
                                for (let j = 0; j < char.splits.length; j++) {
                                    const split = char.splits[j];
                                    if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, split.x, split.y, char.radius * 0.7)) {
                                        split.punishTimer = 6;
                                        split.punishTarget = proj.owner;
                                        split.punishStartAngle = Math.random() * Math.PI * 2;
                                        split.punishRunDistance = 0;
                                        split.punishLastX = split.x;
                                        split.punishLastY = split.y;
                                        split.vx = 0;
                                        split.vy = 0;
                                        
                                        floatingTexts.push({
                                            x: split.x,
                                            y: split.y - 25,
                                            text: '罚跑!',
                                            color: '#e74c3c',
                                            alpha: 1,
                                            vy: -0.5,
                                            life: 1,
                                            initialLife: 1
                                        });
                                        
                                        proj.hit = true;
                                        proj.life = 0;
                                        break;
                                    }
                                }
                                if (proj.hit) break;
                            }
                        }
                    }
                } else if (proj.type === 'melee') {
                    proj.life -= gameSpeed * deltaTime;
                }
            }
            
            projectiles = projectiles.filter(p => p.life > 0 || p.active);
            
            for (const char of characters) {
                if (char.clawHits) {
                    char.clawHits = char.clawHits.filter(p => projectiles.includes(p));
                }
                if (char.splits) {
                    for (const split of char.splits) {
                        if (split.chalkHits) {
                            split.chalkHits = split.chalkHits.filter(p => projectiles.includes(p));
                        }
                        if (split.pulseHits) {
                            split.pulseHits = split.pulseHits.filter(p => projectiles.includes(p));
                        }
                        if (split.clawHits) {
                            split.clawHits = split.clawHits.filter(p => projectiles.includes(p));
                        }
                        if (split.codeHits) {
                            split.codeHits = split.codeHits.filter(p => projectiles.includes(p));
                        }
                        if (split.bulletHits) {
                            split.bulletHits = split.bulletHits.filter(p => projectiles.includes(p));
                        }
                        if (split.trackingHits) {
                            split.trackingHits = split.trackingHits.filter(p => projectiles.includes(p));
                        }
                    }
                }
            }
            
            const damageNow = Date.now();
            damageTracker.forEach((record, key) => {
                if (damageNow - record.lastTime >= DAMAGE_COMBINE_THRESHOLD / gameSpeed) {
                    record.floatText.isComplete = true;
                    damageTracker.delete(key);
                }
            });
            
            for (const ft of floatingTexts) {
                if (ft.vx) ft.x += ft.vx * gameSpeed * deltaTime * 60;
                if (ft.vy) ft.y += ft.vy * gameSpeed * deltaTime * 60;
                ft.life -= gameSpeed * deltaTime;
                ft.alpha = Math.max(0, ft.life / (ft.initialLife || 1));
                
                if (ft.currentDamage !== ft.targetDamage) {
                    const diff = ft.targetDamage - ft.currentDamage;
                    ft.currentDamage += diff * 0.2;
                    ft.text = `-${Math.round(ft.currentDamage)}`;
                }
            }
            
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
            
            const spawnInterval = 1000;
            
            for (const queueEntry of nigeSpawnQueue) {
                const now = Date.now();
                if (now - queueEntry.lastSpawnTime < spawnInterval / gameSpeed) continue;
                
                const legionMembers = characters.filter(c => c.name === '尼格军团' && c.legionId === queueEntry.legionId);
                const aliveCount = legionMembers.filter(c => c.hp > 0).length;
                const baseAlive = queueEntry.endless ? 2 + nigeTeamSize : 3;
                const maxAlive = queueEntry.endless
                    ? Math.min(8, baseAlive + Math.floor(endlessStats.killed / 10))
                    : 3;
                const maxTotal = queueEntry.endless ? Infinity : 10;
                
                if (aliveCount < maxAlive && queueEntry.totalSent < maxTotal) {
                    let spawnX, spawnY;
                    let attempts = 0;
                    const maxAttempts = 50;
                    
                    do {
                        const side = Math.floor(Math.random() * 4);
                        switch (side) {
                            case 0:
                                spawnX = PADDING - 30;
                                spawnY = PADDING + (HEIGHT - PADDING * 2) * Math.random();
                                break;
                            case 1:
                                spawnX = WIDTH - PADDING + 30;
                                spawnY = PADDING + (HEIGHT - PADDING * 2) * Math.random();
                                break;
                            case 2:
                                spawnX = PADDING + (WIDTH - PADDING * 2) * Math.random();
                                spawnY = PADDING - 30;
                                break;
                            case 3:
                                spawnX = PADDING + (WIDTH - PADDING * 2) * Math.random();
                                spawnY = HEIGHT - PADDING + 30;
                                break;
                        }
                        attempts++;
                    } while (attempts < maxAttempts && characters.some(c => {
                        const dx = c.x - spawnX;
                        const dy = c.y - spawnY;
                        return Math.sqrt(dx * dx + dy * dy) < 80;
                    }));
                    
                    const newSoldier = new NiGeJunTuan(
                        spawnX,
                        spawnY,
                        TEAM_CONFIG[queueEntry.team].color,
                        queueEntry.team,
                        characters.length
                    );
                    newSoldier.legionId = queueEntry.legionId;
                    newSoldier.soldierIndex = queueEntry.totalSent;
                    
                    // 人数补偿是永久增益：补兵/换人的新单位也要套用
                    newSoldier._baseMaxHp = newSoldier.maxHp;
                    if (queueEntry.hpMultiplier && queueEntry.hpMultiplier !== 1) {
                        newSoldier.maxHp = Math.round(newSoldier.maxHp * queueEntry.hpMultiplier);
                        newSoldier.hp = newSoldier.maxHp;
                    }
                    applyMatchHandicap(newSoldier);
                    
                    const centerX = WIDTH / 2;
                    const centerY = HEIGHT / 2;
                    const dx = centerX - spawnX;
                    const dy = centerY - spawnY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        newSoldier.vx = (dx / dist) * newSoldier.speed;
                        newSoldier.vy = (dy / dist) * newSoldier.speed;
                    }
                    
                    normalizeVelocity(newSoldier);
                    
                    characters.push(newSoldier);
                    queueEntry.totalSent++;
                    if (queueEntry.endless) endlessStats.spawned++;
                    queueEntry.lastSpawnTime = now;
                }
            }
            
            if (currentMode === 'nigeTeam') {
                // 存活时间按模拟时间累计，跟随 gameSpeed（暂停时不累加）
                endlessStats.elapsedMs += gameSpeed * deltaTime * 1000;
                
                for (const c of characters) {
                    if (c.name === '尼格军团' && c.team === 'blue' && c.hp <= 0 && !c.countedAsKilled) {
                        c.countedAsKilled = true;
                        endlessStats.killed++;
                    }
                }
                
                updateTeamStats();
                
                if (characters.length > 0 && !characters.some(c => c.team === 'red' && c.hp > 0)) {
                    endEndless();
                }
                return;
            }
            
            updateTeamStats();
            
            const teamsInPlay = Object.keys(matchTeams).filter(team => matchTeams[team] && matchTeams[team].length > 0);
            const activeTeams = teamsInPlay.filter(team => isTeamActive(team));
            
            if (characters.length > 0 && teamsInPlay.length > 0 && activeTeams.length <= 1) {
                if (activeTeams.length === 0) {
                    endDraw();
                } else {
                    endMatch(activeTeams[0]);
                }
            }
        }
        
        function getTeamQueue(team) {
            return nigeSpawnQueue.find(q => q.team === team);
        }
        
        function isTeamActive(team) {
            if (characters.some(c => c.team === team && c.hp > 0)) return true;
            
            const queue = getTeamQueue(team);
            if (!queue) return false;
            if (queue.endless) return true;
            return queue.totalSent < 10;
        }
        
        function getTeamHp(team) {
            if (currentMode === 'nigeTeam' && team === 'blue') return '∞';
            
            let hp = characters.filter(c => c.team === team && c.hp > 0).reduce((sum, c) => sum + c.hp, 0);
            
            const queue = getTeamQueue(team);
            if (queue && !queue.endless) {
                hp += Math.max(0, (10 - queue.totalSent) * 100 * (queue.hpMultiplier || 1));
            }
            
            return Math.max(0, Math.round(hp));
        }
        
        function updateTeamStats() {
            if (characters.length === 0) return;
            
            document.getElementById('redHpDisplay').textContent = getTeamHp('red');
            document.getElementById('blueHpDisplay').textContent = getTeamHp('blue');
            
            if (currentMode === 'ffa') {
                document.getElementById('greenHpDisplay').textContent = getTeamHp('green');
                document.getElementById('yellowHpDisplay').textContent = getTeamHp('yellow');
            }
            
            if (currentMode === 'brawl') {
                const container = document.getElementById('brawlStats');
                container.innerHTML = Object.keys(matchTeams).map(team => {
                    const config = TEAM_CONFIG[team];
                    const alive = characters.some(c => c.team === team && c.hp > 0);
                    const hp = alive ? getTeamHp(team) : 0;
                    return `<span style="color:${config.color};font-weight:bold;">${config.name}: ${alive ? hp : '阵亡'}</span>`;
                }).join('');
            }
            
            if (currentMode === 'nigeTeam') {
                document.getElementById('endlessSpawned').textContent = endlessStats.spawned;
                document.getElementById('endlessKilled').textContent = endlessStats.killed;
                const elapsed = endlessStats.elapsedMs / 1000;
                document.getElementById('endlessTime').textContent = elapsed.toFixed(1) + 's';
            }
        }
        
        function renderMatchDamage() {
            const container = document.getElementById('gameOverDamage');
            const rows = [...matchDamage.values()].sort((a, b) => b.damage - a.damage);
            if (rows.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }
            const list = rows.map((row, index) => {
                const color = (TEAM_CONFIG[row.team] && TEAM_CONFIG[row.team].color) || '#4b5563';
                const rank = index === 0 ? '<b>1</b>' : `${index + 1}`;
                return `<div class="gd-row"><span class="gd-rank">${rank}</span><span class="gd-name" style="color:${color}">${row.name}</span><span class="gd-value">${Math.round(row.damage).toLocaleString()}</span></div>`;
            }).join('');
            container.innerHTML = '<div class="gd-title">本局伤害排行</div>' + list;
            container.style.display = 'block';
        }
        
        function endMatch(winnerTeam) {
            gameOver = true;
            setImmersiveMode(false);
            
            const config = TEAM_CONFIG[winnerTeam];
            const aliveNames = characters.filter(c => c.team === winnerTeam && c.hp > 0).map(c => getUnitRecordName(c));
            
            if (currentMode === 'straight') {
                document.getElementById('gameOverTitle').textContent =
                    winnerTeam === 'red' ? '挑战成功！' : '顺子守擂成功！';
            } else {
                document.getElementById('gameOverTitle').textContent = `${config.name}胜利！`;
            }
            let info;
            if (currentMode === 'straight') {
                info = winnerTeam === 'red' ? '击败了顺子五人组！' : '顺子五人组守擂成功！';
            } else {
                info = aliveNames.length > 0 ? `${aliveNames.join('、')} 赢得了胜利！` : `${config.name} 赢得了胜利！`;
            }
            
            if (currentMode !== 'classic') {
                info += '（本局不计入 1v1 战绩）';
            } else {
                if (winnerTeam === 'red') {
                    redWinCount++;
                    updateCharRecords(currentRedChar, true);
                    updateCharRecords(currentBlueChar, false);
                } else {
                    blueWinCount++;
                    updateCharRecords(currentBlueChar, true);
                    updateCharRecords(currentRedChar, false);
                }
                document.getElementById('redWinCount').textContent = redWinCount;
                document.getElementById('blueWinCount').textContent = blueWinCount;
                document.getElementById('totalMatchCount').textContent = redWinCount + blueWinCount;
                updateLeaderboard();
            }
            
            document.getElementById('gameOverInfo').textContent = info;
            renderMatchDamage();
            document.getElementById('gameOverOverlay').style.display = 'flex';
            
            if (isAutoTest) {
                scheduleNextAutoTest();
            }
        }
        
        function endDraw() {
            gameOver = true;
            setImmersiveMode(false);
            
            document.getElementById('gameOverTitle').textContent = '平局';
            document.getElementById('gameOverInfo').textContent = '所有队伍同时全灭。';
            renderMatchDamage();
            document.getElementById('gameOverOverlay').style.display = 'flex';
            
            if (isAutoTest) {
                scheduleNextAutoTest();
            }
        }
        
        function endEndless() {
            gameOver = true;
            setImmersiveMode(false);
            
            const seconds = (endlessStats.elapsedMs / 1000).toFixed(1);
            document.getElementById('gameOverTitle').textContent = '无限尼格结束';
            document.getElementById('gameOverInfo').textContent =
                `存活 ${seconds} 秒 · 累计出兵 ${endlessStats.spawned} · 累计击杀 ${endlessStats.killed}`;
            renderMatchDamage();
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }
        
        function togglePause() {
            isPaused = !isPaused;
            document.querySelector('button[onclick="togglePause()"]').textContent = isPaused ? '继续' : '暂停';
        }
        
        function startAutoTest() {
            isAutoTest = true;
            setMode('classic');
            autoTestOriginalSpeed = gameSpeed;
            gameSpeed = 10;
            document.getElementById('speedSlider').value = 10;
            document.getElementById('speedValue').textContent = '10x';
            
            resetRecords();
            
            const charKeys = ['GUITOU', 'BAIDAN', 'MAONAI', 'HEIDAN', 'SHINIAN', 'MABA', 'HEZIHAN', 'DIKE', 'WENSHI', 'SHIBING', 'NIGE', 'PO9', 'LIBERTY', 'TANGSHUI', 'MOFANGZHE', 'SHUANGSHENG', 'SHUANGSHINIAN', 'DENGJIE'];
            autoTestQueue = [];
            
            for (let i = 0; i < charKeys.length; i++) {
                for (let j = i + 1; j < charKeys.length; j++) {
                    autoTestQueue.push({ red: charKeys[i], blue: charKeys[j] });
                }
            }
            
            autoTestCurrentMatch = 0;
            autoTestCurrentGame = 0;
            
            startNextAutoTestGame();
        }
        
        function startNextAutoTestGame() {
            if (autoTestCurrentMatch >= autoTestQueue.length) {
                finishAutoTest();
                return;
            }
            
            const match = autoTestQueue[autoTestCurrentMatch];
            
            selectionState.red[0] = match.red;
            selectionState.blue[0] = match.blue;
            
            document.getElementById('gameOverOverlay').style.display = 'none';
            
            const charClasses = {
                GUITOU: GuiTou,
                BAIDAN: BaiDan,
                MAONAI: MaoNai,
                HEIDAN: HeiDan,
                SHINIAN: ShiNianZhiHou,
                MABA: MaBa,
                HEZIHAN: HeZiHan,
                DIKE: DiKeDeHeiDiao,
                WENSHI: WenShiDaPeng,
                SHIBING: ShiBing,
                TEST: Test,
                NIGE: NiGeJunTuan,
                CHENZHICHONG: ChenZhiChong,
                MOFANGZHE: MoFangZhe,
                PO9: PO9,
                LIBERTY: Liberty,
                TANGSHUI: TangShui,
                SHUANGSHENG: MaoNai,
                SHUANGSHINIAN: ShiNianZhiHou,
                DENGJIE: DengJie,
                BANCAO: BanCao
            };
            
            characters = [];
            
            projectiles = [];
            floatingTexts = [];
            gameOver = false;
            
            currentRedChar = match.red;
            currentBlueChar = match.blue;
            matchTeams = { red: [match.red], blue: [match.blue] };
            
            characters = [];
            nigeSpawnQueue = [];
            
            if (match.red === 'SHUANGSHENG') {
                const mao = new MaoNai(160, 165, '#e74c3c', 'red', characters.length);
                mao.hp = 500;
                mao.maxHp = 500;
                mao.isShuangshengUnit = true;
                normalizeVelocity(mao);
                characters.push(mao);
                
                const liu = new LiuChuanChuan(160, 235, '#e74c3c', 'red', characters.length);
                liu.isShuangshengUnit = true;
                normalizeVelocity(liu);
                characters.push(liu);
            } else if (match.red === 'SHUANGSHINIAN') {
                const shinian = new ShiNianZhiHou(160, 165, '#e74c3c', 'red', characters.length);
                shinian.hp = 500;
                shinian.maxHp = 500;
                shinian.isTwinTenUnit = true;
                normalizeVelocity(shinian);
                characters.push(shinian);
                
                const ershi = new ErShi(160, 235, '#e74c3c', 'red', characters.length);
                ershi.isTwinTenUnit = true;
                normalizeVelocity(ershi);
                characters.push(ershi);
            } else if (match.red === 'NIGE') {
                const legionId = ++nigeLegionCounter;
                for (let i = 0; i < 3; i++) {
                    const offsetAngle = (Math.PI * 2 / 3) * i;
                    const offsetX = Math.cos(offsetAngle) * 40;
                    const offsetY = Math.sin(offsetAngle) * 40;
                    const soldier = new NiGeJunTuan(160 + offsetX, 200 + offsetY, '#e74c3c', 'red', characters.length);
                    soldier.legionId = legionId;
                    soldier.soldierIndex = i;
                    characters.push(soldier);
                }
                
                nigeSpawnQueue.push({
                    legionId: legionId,
                    team: 'red',
                    totalSent: 3,
                    lastSpawnTime: Date.now() - 1000
                });
            } else {
                const redChar = new charClasses[match.red](160, 200, '#e74c3c', 'red', 0);
                normalizeVelocity(redChar);
                characters.push(redChar);
            }
            
            if (match.blue === 'SHUANGSHENG') {
                const mao = new MaoNai(240, 165, '#3498db', 'blue', characters.length);
                mao.hp = 500;
                mao.maxHp = 500;
                mao.isShuangshengUnit = true;
                normalizeVelocity(mao);
                characters.push(mao);
                
                const liu = new LiuChuanChuan(240, 235, '#3498db', 'blue', characters.length);
                liu.isShuangshengUnit = true;
                normalizeVelocity(liu);
                characters.push(liu);
            } else if (match.blue === 'SHUANGSHINIAN') {
                const shinian = new ShiNianZhiHou(240, 165, '#3498db', 'blue', characters.length);
                shinian.hp = 500;
                shinian.maxHp = 500;
                shinian.isTwinTenUnit = true;
                normalizeVelocity(shinian);
                characters.push(shinian);
                
                const ershi = new ErShi(240, 235, '#3498db', 'blue', characters.length);
                ershi.isTwinTenUnit = true;
                normalizeVelocity(ershi);
                characters.push(ershi);
            } else if (match.blue === 'NIGE') {
                const legionId = ++nigeLegionCounter;
                for (let i = 0; i < 3; i++) {
                    const offsetAngle = (Math.PI * 2 / 3) * i;
                    const offsetX = Math.cos(offsetAngle) * 40;
                    const offsetY = Math.sin(offsetAngle) * 40;
                    const soldier = new NiGeJunTuan(240 + offsetX, 200 + offsetY, '#3498db', 'blue', characters.length);
                    soldier.legionId = legionId;
                    soldier.soldierIndex = i;
                    characters.push(soldier);
                }
                
                nigeSpawnQueue.push({
                    legionId: legionId,
                    team: 'blue',
                    totalSent: 3,
                    lastSpawnTime: Date.now() - 1000
                });
            } else {
                const blueChar = new charClasses[match.blue](240, 200, '#3498db', 'blue', characters.length);
                normalizeVelocity(blueChar);
                characters.push(blueChar);
            }
            
            for (const char of characters) {
                const speed = char.currentSpeed || char.speed || BASE_SPEED;
                
                do {
                    const currentSpeed = Math.sqrt(char.vx * char.vx + char.vy * char.vy);
                    
                    if (currentSpeed < speed * 0.1 || currentSpeed > speed * 1.1 || 
                        Math.abs(char.vx) < speed * 0.3 || Math.abs(char.vy) < speed * 0.3) {
                        let angle;
                        do {
                            angle = Math.random() * Math.PI * 2;
                        } while (Math.abs(Math.cos(angle)) < 0.3 || Math.abs(Math.sin(angle)) < 0.3);
                        
                        char.vx = Math.cos(angle) * speed;
                        char.vy = Math.sin(angle) * speed;
                    } else {
                        break;
                    }
                } while (true);
            }
        }
        
        function scheduleNextAutoTest() {
            autoTestCurrentGame++;
            
            if (autoTestCurrentGame >= autoTestGamesPerMatch) {
                autoTestCurrentGame = 0;
                autoTestCurrentMatch++;
            }
            
            gameSpeed = 10;
            document.getElementById('speedSlider').value = gameSpeed;
            document.getElementById('speedValue').textContent = gameSpeed + 'x';
            
            setTimeout(() => {
                startNextAutoTestGame();
            }, 200);
        }
        
        function finishAutoTest() {
            isAutoTest = false;
            gameSpeed = autoTestOriginalSpeed;
            document.getElementById('speedSlider').value = autoTestOriginalSpeed;
            document.getElementById('speedValue').textContent = autoTestOriginalSpeed + 'x';
            
            alert('自动测试完成！请查看排行榜结果。');
        }
        
        function updateCharRecords(charKey, isWin) {
            if (charRecords[charKey]) {
                charRecords[charKey].matches++;
                if (isWin) {
                    charRecords[charKey].wins++;
                } else {
                    charRecords[charKey].losses++;
                }
            }
        }
        
        function updateLeaderboard() {
            const body = document.getElementById('leaderboardBody');
            const sorted = Object.values(charRecords).sort((a, b) => {
                const rateA = a.matches > 0 ? a.wins / a.matches : 0;
                const rateB = b.matches > 0 ? b.wins / b.matches : 0;
                return rateB - rateA;
            });
            
            body.innerHTML = sorted.map((record, index) => {
                const rate = record.matches > 0 ? ((record.wins / record.matches) * 100).toFixed(1) : '-';
                return `
                    <div class="leaderboard-row">
                        <span class="lb-col-name">${index === 0 ? '🥇 ' : ''}${record.name}</span>
                        <span class="lb-col">${record.matches}</span>
                        <span class="lb-col">${record.wins}</span>
                        <span class="lb-col">${record.losses}</span>
                        <span class="lb-col">${rate}%</span>
                    </div>
                `;
            }).join('');
        }
        
        function resetRecords() {
            redWinCount = 0;
            blueWinCount = 0;
            document.getElementById('redWinCount').textContent = '0';
            document.getElementById('blueWinCount').textContent = '0';
            document.getElementById('totalMatchCount').textContent = '0';
            
            for (const key in charRecords) {
                charRecords[key].matches = 0;
                charRecords[key].wins = 0;
                charRecords[key].losses = 0;
            }
            updateLeaderboard();
        }
        
        function gameLoop() {
            const currentTime = performance.now();
            deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            if (!isPaused) {
                update();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        const CHAR_CLASSES = {
            GUITOU: GuiTou,
            BAIDAN: BaiDan,
            MAONAI: MaoNai,
            HEIDAN: HeiDan,
            SHINIAN: ShiNianZhiHou,
            MABA: MaBa,
            HEZIHAN: HeZiHan,
            DIKE: DiKeDeHeiDiao,
            WENSHI: WenShiDaPeng,
            SHIBING: ShiBing,
            TEST: Test,
            NIGE: NiGeJunTuan,
            CHENZHICHONG: ChenZhiChong,
            MOFANGZHE: MoFangZhe,
            PO9: PO9,
            LIBERTY: Liberty,
            TANGSHUI: TangShui,
            SHUANGSHENG: MaoNai,
            SHUANGSHINIAN: ShiNianZhiHou,
            DENGJIE: DengJie,
            DENGJIEA: DengJiePlus,
            BANCAO: BanCao,
            ERSHI: ErShi,
            LIUCHUANCHUAN: LiuChuanChuan
        };
        
        // 命中前血量快照：用于伤害排行的过杀裁剪
        function installDamageProbe(ctor) {
            const proto = ctor && ctor.prototype;
            const orig = proto && proto.takeDamage;
            if (!orig || orig.__damageProbe) return;
            const wrapped = function (damage, attacker, floatTexts) {
                this._hpBefore = this.hp;
                return orig.call(this, damage, attacker, floatTexts);
            };
            wrapped.__damageProbe = true;
            proto.takeDamage = wrapped;
        }
        [...new Set([...Object.values(CHAR_CLASSES), ErShi, LiuChuanChuan])].forEach(installDamageProbe);
        
        function createFighter(type, team, x, y, hpMultiplier = 1, atkMultiplier = 1) {
            const color = TEAM_CONFIG[team].color;
            const created = [];
            
            if (type === 'SHUANGSHENG') {
                const mao = new MaoNai(x, y - 30, color, team, characters.length);
                mao.hp = 500;
                mao.maxHp = 500;
                mao.isShuangshengUnit = true;
                characters.push(mao);
                created.push(mao);
                
                const liu = new LiuChuanChuan(x, y + 30, color, team, characters.length);
                liu.isShuangshengUnit = true;
                characters.push(liu);
                created.push(liu);
            } else if (type === 'SHUANGSHINIAN') {
                const shinian = new ShiNianZhiHou(x, y - 30, color, team, characters.length);
                shinian.hp = 500;
                shinian.maxHp = 500;
                shinian.isTwinTenUnit = true;
                characters.push(shinian);
                created.push(shinian);
                
                const ershi = new ErShi(x, y + 30, color, team, characters.length);
                ershi.isTwinTenUnit = true;
                characters.push(ershi);
                created.push(ershi);
            } else if (type === 'NIGE') {
                const legionId = ++nigeLegionCounter;
                for (let i = 0; i < 3; i++) {
                    const angle = (Math.PI * 2 / 3) * i;
                    const soldier = new NiGeJunTuan(
                        x + Math.cos(angle) * 40,
                        y + Math.sin(angle) * 40,
                        color, team, characters.length
                    );
                    soldier.legionId = legionId;
                    soldier.soldierIndex = i;
                    characters.push(soldier);
                    created.push(soldier);
                }
                
                nigeSpawnQueue.push({
                    legionId: legionId,
                    team: team,
                    totalSent: 3,
                    lastSpawnTime: Date.now() - 1000,
                    endless: false,
                    hpMultiplier: hpMultiplier
                });
            } else {
                const unit = new CHAR_CLASSES[type](x, y, color, team, characters.length);
                characters.push(unit);
                created.push(unit);
            }
            
            for (const unit of created) {
                if (hpMultiplier !== 1) {
                    unit._baseMaxHp = unit.maxHp;
                    unit.maxHp = Math.round(unit.maxHp * hpMultiplier);
                    unit.hp = unit.maxHp;
                }
                if (atkMultiplier !== 1) {
                    unit.attackMultiplier = atkMultiplier;
                }
                normalizeVelocity(unit);
            }
            
            return created;
        }
        
        function spawnTeam(types, team, baseX, baseY, gap, hpMultiplier = 1, atkMultiplier = 1) {
            const total = types.length;
            types.forEach((type, index) => {
                const offset = gap * (index - (total - 1) / 2);
                createFighter(type, team, baseX, baseY + offset, hpMultiplier, atkMultiplier);
            });
        }
        
        function spawnTeamRing(types, team, baseX, baseY, radius, hpMultiplier = 1, atkMultiplier = 1) {
            const total = types.length;
            types.forEach((type, index) => {
                const angle = total === 1 ? 0 : (Math.PI * 2 / total) * index;
                const offsetX = total === 1 ? 0 : Math.cos(angle) * radius;
                const offsetY = total === 1 ? 0 : Math.sin(angle) * radius;
                createFighter(type, team, baseX + offsetX, baseY + offsetY, hpMultiplier, atkMultiplier);
            });
        }
        
        // 同一队伍多人时按地图可用高度自适应纵向间距，避免超出边界
        function gapForTeamCount(count) {
            const room = HEIGHT - PADDING * 2 - 60;
            return Math.min(70, room / Math.max(1, count - 1));
        }
        
        function spawnNigeLegion(team, baseX, baseY, count) {
            const legionId = ++nigeLegionCounter;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const soldier = new NiGeJunTuan(
                    baseX + Math.cos(angle) * 40,
                    baseY + Math.sin(angle) * 40,
                    TEAM_CONFIG[team].color, team, characters.length
                );
                soldier.legionId = legionId;
                soldier.soldierIndex = i;
                characters.push(soldier);
            }
            return legionId;
        }
        
        // 非对称竞技的人数补偿：2v3 生命 +100% / 攻击 +15%；1v3 生命 +200% / 攻击 +75%
        function computeAsymBonus(redCount, blueCount) {
            if (redCount === blueCount || redCount === 0 || blueCount === 0) {
                return { side: null, hp: 1, atk: 1 };
            }
            const side = redCount < blueCount ? 'red' : 'blue';
            const diff = Math.abs(redCount - blueCount);
            const table = [
                null,
                { hp: 2.0, atk: 1.15 },
                { hp: 3.0, atk: 1.75 }
            ];
            const bonus = diff <= 2
                ? table[diff]
                : { hp: 3.0 + (diff - 2) * 0.5, atk: 1.75 + (diff - 2) * 0.1 };
            return { side, hp: bonus.hp, atk: bonus.atk };
        }
        
        // 人数补偿是永久增益：变身、补兵、克隆等新建单位都要重新套用
        function applyMatchHandicap(unit) {
            if (!unit || !unit.team) return;
            // 变身中的魔怔鸡血量由模仿形态决定，本体不参与基准校正
            if (unit.isTransforming && unit.currentForm) return;
            const hpMul = matchHandicap[unit.team] || 1;
            const atkMul = matchAttackHandicap[unit.team] || 1;
            if (hpMul !== 1 && Number.isFinite(unit.maxHp) && unit.maxHp > 0) {
                if (!unit._baseMaxHp || unit._baseMaxHp <= 0) unit._baseMaxHp = unit.maxHp;
                const expectedMaxHp = Math.round(unit._baseMaxHp * hpMul);
                if (unit.maxHp !== expectedMaxHp) {
                    const ratio = Math.max(0, unit.hp / unit.maxHp);
                    unit.maxHp = expectedMaxHp;
                    unit.hp = Math.max(1, Math.round(expectedMaxHp * ratio));
                }
            }
            if (atkMul > 1) {
                unit.attackMultiplier = Math.max(unit.attackMultiplier || 1, atkMul);
            }
        }
        
        function computeMatchHandicaps(teams) {
            const hp = { red: 1, blue: 1, green: 1, yellow: 1 };
            const atk = { red: 1, blue: 1, green: 1, yellow: 1 };
            if (currentMode !== 'asym' || !asymBalanceEnabled) return { hp, atk };
            
            const bonus = computeAsymBonus(teams.red ? teams.red.length : 0, teams.blue ? teams.blue.length : 0);
            if (!bonus.side) return { hp, atk };
            
            hp[bonus.side] = bonus.hp;
            atk[bonus.side] = bonus.atk;
            return { hp, atk };
        }
        
        function setupMatch(teams) {
            matchTeams = teams;
            characters = [];
            projectiles = [];
            floatingTexts = [];
            nigeSpawnQueue = [];
            matchDamage = new Map();
            gameOver = false;
            endlessStats = { spawned: 0, killed: 0, elapsedMs: 0 };
            const handicaps = computeMatchHandicaps(teams);
            matchHandicap = handicaps.hp;
            matchAttackHandicap = handicaps.atk;
            
            const totalSlots = Object.keys(teams)
                .reduce((sum, team) => sum + (teams[team] ? teams[team].length : 0), 0);
            applyMapSize(computeMapSize(totalSlots));
            
            const mapWidth = WIDTH - PADDING * 2;
            const mapHeight = HEIGHT - PADDING * 2;
            const leftX = PADDING + mapWidth * 0.25;
            const rightX = PADDING + mapWidth * 0.75;
            const midY = PADDING + mapHeight / 2;
            const topY = PADDING + mapHeight * 0.25;
            const bottomY = PADDING + mapHeight * 0.75;
            
            if (currentMode === 'classic') {
                spawnTeam(teams.red, 'red', leftX, midY, 0, matchHandicap.red);
                spawnTeam(teams.blue, 'blue', rightX, midY, 0, matchHandicap.blue);
            } else if (currentMode === '2v2') {
                spawnTeam(teams.red, 'red', leftX, midY, 70, matchHandicap.red);
                spawnTeam(teams.blue, 'blue', rightX, midY, 70, matchHandicap.blue);
            } else if (currentMode === 'ffa') {
                spawnTeamRing(teams.red, 'red', leftX, topY, ffaTeamSize > 1 ? 40 : 0, matchHandicap.red);
                spawnTeamRing(teams.blue, 'blue', rightX, topY, ffaTeamSize > 1 ? 40 : 0, matchHandicap.blue);
                spawnTeamRing(teams.green, 'green', leftX, bottomY, ffaTeamSize > 1 ? 40 : 0, matchHandicap.green);
                spawnTeamRing(teams.yellow, 'yellow', rightX, bottomY, ffaTeamSize > 1 ? 40 : 0, matchHandicap.yellow);
            } else if (currentMode === 'brawl') {
                // 每人独立一队，围绕地图中心均匀分布
                const keys = Object.keys(teams);
                const centerX = PADDING + mapWidth / 2;
                const centerY = PADDING + mapHeight / 2;
                const radius = Math.min(mapWidth, mapHeight) * (keys.length <= 2 ? 0.28 : 0.34);
                keys.forEach((team, index) => {
                    const angle = (Math.PI * 2 / keys.length) * index - Math.PI / 2;
                    spawnTeam(teams[team], team, centerX + Math.cos(angle) * radius, centerY + Math.sin(angle) * radius, 0);
                });
            } else if (currentMode === 'straight') {
                spawnTeam(teams.red, 'red', leftX, midY, gapForTeamCount(teams.red.length), matchHandicap.red);
                spawnTeam(STRAIGHT_TEAM_TYPES, 'blue', rightX, midY, gapForTeamCount(STRAIGHT_TEAM_TYPES.length));
                // 顺子成员独立出场，跳过双生羁绊判定
                for (const char of characters) {
                    if (char.team === 'blue') char.isStraightUnit = true;
                }
            } else if (currentMode === 'asym') {
                spawnTeam(teams.red, 'red', leftX, midY, gapForTeamCount(teams.red.length), matchHandicap.red, matchAttackHandicap.red);
                spawnTeam(teams.blue, 'blue', rightX, midY, gapForTeamCount(teams.blue.length), matchHandicap.blue, matchAttackHandicap.blue);
            } else if (currentMode === 'nigeTeam') {
                spawnTeam(teams.red, 'red', leftX, midY, gapForTeamCount(teams.red.length), matchHandicap.red);
                const initialCount = 2 + teams.red.length;
                const legionId = spawnNigeLegion('blue', rightX, midY, initialCount);
                nigeSpawnQueue.push({
                    legionId: legionId,
                    team: 'blue',
                    totalSent: initialCount,
                    lastSpawnTime: Date.now() - 1000,
                    endless: true
                });
                endlessStats.spawned = initialCount;
            }
            
            const now = Date.now();
            for (const char of characters) {
                if (char.lastCrashTime !== undefined) {
                    char.lastCrashTime = now;
                }
            }
            
            for (const char of characters) {
                const speed = char.currentSpeed || char.speed || BASE_SPEED;
                
                do {
                    const currentSpeed = Math.sqrt(char.vx * char.vx + char.vy * char.vy);
                    
                    if (currentSpeed < speed * 0.1 || currentSpeed > speed * 1.1 || 
                        Math.abs(char.vx) < speed * 0.3 || Math.abs(char.vy) < speed * 0.3) {
                        let angle;
                        do {
                            angle = Math.random() * Math.PI * 2;
                        } while (Math.abs(Math.cos(angle)) < 0.3 || Math.abs(Math.sin(angle)) < 0.3);
                        
                        char.vx = Math.cos(angle) * speed;
                        char.vy = Math.sin(angle) * speed;
                    } else {
                        break;
                    }
                } while (true);
            }
            
            updateTeamStats();
        }
        
        function readTeamSelection(team) {
            const count = getTeamSlotCount(team);
            const roles = [];
            for (let i = 0; i < count; i++) {
                const roleKey = selectionState[team][i];
                if (!roleKey) return null;
                roles.push(roleKey);
            }
            return roles;
        }
        
        function startGame() {
            document.getElementById('gameOverOverlay').style.display = 'none';
            
            let teams = { red: [], blue: [], green: [], yellow: [] };
            
            if (currentMode === 'brawl') {
                // 每人独立成队：玩家1 → p1、玩家2 → p2 …
                const roles = readTeamSelection('brawl');
                if (!roles) {
                    alert('请为所有玩家选择角色');
                    return;
                }
                ensureBrawlTeamConfigs(roles.length);
                teams = {};
                roles.forEach((roleKey, index) => {
                    teams[brawlTeamKey(index)] = [roleKey];
                });
            } else if (currentMode === 'straight') {
                // 玩家自选阵容挑战固定顺子五人组
                const roles = readTeamSelection('red');
                if (!roles) {
                    alert('请为所有槽位选择角色');
                    return;
                }
                if (roles.some((key, index) => roles.indexOf(key) !== index)) {
                    alert('同一方不能选择相同角色');
                    return;
                }
                teams = { red: roles, blue: STRAIGHT_TEAM_TYPES.slice() };
            } else {
                for (const team of getVisibleTeams()) {
                    const count = getTeamSlotCount(team);
                    if (count === 0) continue;
                    
                    const roles = readTeamSelection(team);
                    if (!roles) {
                        alert('请为所有槽位选择角色');
                        return;
                    }
                    if (roles.some((key, index) => roles.indexOf(key) !== index)) {
                        alert('同一方不能选择相同角色');
                        return;
                    }
                    teams[team] = roles;
                }
            }
            
            currentRedChar = teams.red ? teams.red[0] : '';
            currentBlueChar = teams.blue ? teams.blue[0] : '';
            
            setupMatch(teams);
        }
        
        renderRoster();
        setMode('classic');
        
        gameLoop();
    </script>
</body>
