                                break;
                            }
                            
                            if (char.splits) {
                                for (let j = 0; j < char.splits.length; j++) {
                                    const split = char.splits[j];
                                    if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, split.x, split.y, char.radius * 0.7)) {
                                        if (!split.pulseHits || !split.pulseHits.includes(proj)) {
                                            split.hp -= proj.damage;
                                            showDamageText({ x: split.x, y: split.y }, proj.damage, '#e74c3c', proj.owner);
                                            if (split.hp <= 0) {
                                                char.splits.splice(j, 1);
                                                j--;
                                            } else {
                                                if (!split.pulseHits) split.pulseHits = [];
                                                split.pulseHits.push(proj);
                                            }
                                        }
                                    } else {
                                        if (split.pulseHits && split.pulseHits.includes(proj)) {
                                            split.pulseHits = split.pulseHits.filter(p => p !== proj);
                                        }
                                    }
                                }
                            }
                        }
                    }
                } else if (proj.type === 'code') {
                    proj.x += proj.vx * gameSpeed * deltaTime * 60;
                    proj.y += proj.vy * gameSpeed * deltaTime * 60;
                    proj.life -= gameSpeed * deltaTime;
                    
                    if (proj.x < PADDING || proj.x > WIDTH - PADDING ||
                        proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                        proj.life = 0;
                        continue;
                    }
                    
                    let hit = false;
                    for (const char of characters) {
                        if (char === proj.owner || char.hp <= 0) continue;
                        
                        if (checkCircleSquareCollision(proj.x, proj.y, 10, char.x, char.y, char.radius)) {
                            let damage = proj.damage;
                            if (char.bugCount && char.bugCount > 0) {
                                damage += char.bugCount * 10;
                            }
                            
                            const result = char.takeDamage(damage, proj.owner, floatingTexts);
                            showDamageText(char, result.damage, '#e74c3c', proj.owner);
                            
                            if (!proj.optimized) {
                                const codeLength = proj.text ? proj.text.length : 0;
                                const bugIncrease = Math.min(Math.floor(codeLength / 10), 5);
                                if (bugIncrease > 0) {
                                    if (!char.bugCount) char.bugCount = 0;
                                    if (!char.bugTimer) char.bugTimer = 0;
                                    char.bugCount = Math.min(5, char.bugCount + bugIncrease);
                                    char.bugTimer = 10;
                                }
                            }
                            
                            proj.life = 0;
                            hit = true;
                            break;
                        }
                        
                        if (char.splits) {
                            for (let j = 0; j < char.splits.length; j++) {
                                const split = char.splits[j];
                                if (checkCircleSquareCollision(proj.x, proj.y, 6, split.x, split.y, char.radius * 0.7)) {
                                    if (!split.codeHits || !split.codeHits.includes(proj)) {
                                        split.hp -= proj.damage;
                                        showDamageText({ x: split.x, y: split.y }, proj.damage, '#e74c3c', proj.owner);
                                        
                                        if (split.hp <= 0) {
                                            char.splits.splice(j, 1);
                                            j--;
                                        } else {
                                            if (!split.codeHits) split.codeHits = [];
                                            split.codeHits.push(proj);
                                        }
                                    }
                                } else {
                                    if (split.codeHits && split.codeHits.includes(proj)) {
                                        split.codeHits = split.codeHits.filter(p => p !== proj);
                                    }
                                }
                            }
                        }
                    }
                } else if (proj.type === 'whistle') {
                    proj.x += proj.vx * gameSpeed * deltaTime * 60;
                    proj.y += proj.vy * gameSpeed * deltaTime * 60;
                    proj.life -= gameSpeed * deltaTime;
                    
                    if (proj.x < PADDING || proj.x > WIDTH - PADDING ||
                        proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                        proj.life = 0;
                        continue;
                    }
                    
                    for (const char of characters) {
                        if (char === proj.owner || char.hp <= 0) continue;
                        if (proj.skipTeamHit && proj.owner && char.team === proj.owner.team) continue;
                        
                        if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, char.x, char.y, char.radius)) {
                            const result = char.takeDamage(proj.damage, proj.owner, floatingTexts);
                            showDamageText(char, result.damage, '#e74c3c', proj.owner);
                            proj.life = 0;
                            
                            if (proj.owner && proj.owner.bulletHitCount !== undefined) {
                                proj.owner.bulletHitCount++;
                                if (proj.owner.bulletHitCount >= 5) {
                                    const enemies = characters.filter(c => c !== proj.owner && c.team !== proj.owner.team && c.hp > 0);
                                    proj.owner.triggerAutoPunish(enemies, projectiles, floatingTexts);
                                    proj.owner.bulletHitCount = 0;
                                }
                            }
                            
                            break;
                        }
                        
                        if (char.splits) {
                            for (let j = 0; j < char.splits.length; j++) {
                                const split = char.splits[j];
                                if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, split.x, split.y, char.radius * 0.7)) {
                                    if (!split.codeHits || !split.codeHits.includes(proj)) {
                                        split.hp -= proj.damage;
                                        showDamageText({ x: split.x, y: split.y }, proj.damage, '#e74c3c', proj.owner);
                                        if (split.hp <= 0) {
                                            char.splits.splice(j, 1);
                                            j--;
                                        } else {
                                            if (!split.codeHits) split.codeHits = [];
                                            split.codeHits.push(proj);
                                        }
                                    }
                                } else {
                                    if (split.codeHits && split.codeHits.includes(proj)) {
                                        split.codeHits = split.codeHits.filter(p => p !== proj);
                                    }
                                }
                            }
                        }
                    }
                } else if (proj.type === 'whistleWave') {
                    proj.life -= gameSpeed * deltaTime;
                } else if (proj.type === 'tracking') {
                    proj.trail.push({ x: proj.x, y: proj.y });
                    if (proj.trail.length > (proj.maxTrail || 10)) {
                        proj.trail.shift();
                    }
                    
                    proj.x += proj.vx * gameSpeed * deltaTime * 60;
                    proj.y += proj.vy * gameSpeed * deltaTime * 60;
                    
                    if (proj.owner && proj.owner.target && proj.owner.target.hp > 0) {
                        const target = proj.owner.target;
                        const dx = target.x - proj.x;
                        const dy = target.y - proj.y;
                        const targetAngle = Math.atan2(dy, dx);
                        const currentAngle = Math.atan2(proj.vy, proj.vx);
                        const angleDiff = targetAngle - currentAngle;
                        const clampedDiff = ((angleDiff % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                        let adjustedDiff = clampedDiff;
                        if (adjustedDiff > Math.PI) adjustedDiff -= Math.PI * 2;
                        const newAngle = currentAngle + adjustedDiff * (proj.trackStrength || 0.02);
                        const speed = Math.sqrt(proj.vx * proj.vx + proj.vy * proj.vy);
                        proj.vx = Math.cos(newAngle) * speed;
                        proj.vy = Math.sin(newAngle) * speed;
                    }
                    
                    let bounced = false;
                    if (proj.x < PADDING || proj.x > WIDTH - PADDING) {
                        proj.vx *= -1;
                        proj.x = Math.max(PADDING, Math.min(WIDTH - PADDING, proj.x));
                        bounced = true;
                    }
                    if (proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                        proj.vy *= -1;
                        proj.y = Math.max(PADDING, Math.min(HEIGHT - PADDING, proj.y));
                        bounced = true;
                    }
                    
                    if (bounced) {
                        proj.bounces--;
                        const speed = Math.sqrt(proj.vx * proj.vx + proj.vy * proj.vy);
                        proj.vx = (proj.vx / speed) * speed * 0.7;
                        proj.vy = (proj.vy / speed) * speed * 0.7;
                        
                        if (proj.bounces <= 0) {
                            proj.life = 0;
                            proj.active = false;
                            continue;
                        }
                    }
                    
                    let hit = false;
                    for (const char of characters) {
                        if (char === proj.owner || char.hp <= 0) continue;
                        
                        if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, char.x, char.y, char.radius)) {
                            const result = char.takeDamage(proj.damage, proj.owner, floatingTexts);
                            showDamageText(char, result.damage, '#e74c3c', proj.owner);
                            proj.life = 0;
                            proj.active = false;
                            hit = true;
                            break;
                        }
                        
                        if (char.splits) {
                            for (let j = 0; j < char.splits.length; j++) {
                                const split = char.splits[j];
                                if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, split.x, split.y, char.radius * 0.7)) {
                                    split.hp -= proj.damage;
                                    showDamageText({ x: split.x, y: split.y }, proj.damage, '#e74c3c', proj.owner);
                                    proj.life = 0;
                                    proj.active = false;
                                    if (split.hp <= 0) {
                                        char.splits.splice(j, 1);
                                        j--;
                                    }
                                    hit = true;
                                    break;
                                }
                            }
                            if (hit) break;
                        }
                    }
                } else if (proj.type === 'question') {
                    proj.x += proj.vx * gameSpeed * deltaTime * 60;
                    proj.y += proj.vy * gameSpeed * deltaTime * 60;
                    
                    if (proj.x < PADDING || proj.x > WIDTH - PADDING ||
                        proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                        proj.active = false;
                        continue;
                    }
                    
                    for (const char of characters) {
                        if (char === proj.owner || char.hp <= 0) continue;
                        
                        if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, char.x, char.y, char.radius)) {
                            if (!char.questions) char.questions = 0;
                            if (char.questions < 3) {
                                char.questions++;
                                char.lastQuestionTime = Date.now();
                            }
                            proj.active = false;
                            break;
                        }
                    }
                } else if (proj.type === 'bullet') {
                    proj.trail.push({ x: proj.x, y: proj.y });
                    if (proj.trail.length > (proj.maxTrail || 10)) {
                        proj.trail.shift();
                    }
                    
                    proj.x += proj.vx * gameSpeed * deltaTime * 60;
                    proj.y += proj.vy * gameSpeed * deltaTime * 60;
                    
                    if (proj.canBounce !== false) {
                        let bounced = false;
                        if (proj.x < PADDING || proj.x > WIDTH - PADDING) {
                            proj.vx *= -1;
                            proj.x = Math.max(PADDING, Math.min(WIDTH - PADDING, proj.x));
                            bounced = true;
                        }
                        if (proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                            proj.vy *= -1;
                            proj.y = Math.max(PADDING, Math.min(HEIGHT - PADDING, proj.y));
                            bounced = true;
                        }
                        
                        if (bounced) {
                            proj.bounces--;
                            const speed = Math.sqrt(proj.vx * proj.vx + proj.vy * proj.vy);
                            proj.vx = (proj.vx / speed) * speed * 0.7;
                            proj.vy = (proj.vy / speed) * speed * 0.7;
                            
                            if (proj.bounces <= 0) {
                                proj.life = 0;
                                proj.active = false;
                                continue;
                            }
                        }
                    } else {
                        if (proj.x < PADDING || proj.x > WIDTH - PADDING ||
                            proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                            proj.life = 0;
                            proj.active = false;
                            continue;
                        }
                    }
                    
                    if (!proj.currentHitTargets) proj.currentHitTargets = [];
                    
                    const stillHitting = [];
                    
                    for (const char of characters) {
                        if (char === proj.owner || char.hp <= 0) continue;
                        
                        const isColliding = checkCircleSquareCollision(proj.x, proj.y, proj.radius, char.x, char.y, char.radius);
                        
                        if (isColliding) {
                            stillHitting.push(char);
                            
                            if (!proj.currentHitTargets.includes(char)) {
                                const result = char.takeDamage(proj.damage, proj.owner, floatingTexts);
                                showDamageText(char, result.damage, '#e74c3c', proj.owner);
                                proj.currentHitTargets.push(char);
                                proj.damage = Math.floor(proj.damage * 0.7);
                                
                                if (char.questions && char.questions > 0) {
                                    char.questions--;
                                }
                                
                                if (proj.currentHitTargets.length >= (proj.maxPenetrate || 3)) {
                                    proj.life = 0;
                                    proj.active = false;
                                    break;
                                }
                            }
                        }
                        
                        if (char.splits) {
                            for (let j = 0; j < char.splits.length; j++) {
                                const split = char.splits[j];
                                const splitColliding = checkCircleSquareCollision(proj.x, proj.y, proj.radius, split.x, split.y, char.radius * 0.7);
                                
                                if (splitColliding) {
                                    stillHitting.push(split);
                                    
                                    if (!proj.currentHitTargets.includes(split)) {
                                        split.hp -= proj.damage;
                                        showDamageText({ x: split.x, y: split.y }, proj.damage, '#e74c3c', proj.owner);
                                        proj.currentHitTargets.push(split);
                                        proj.damage = Math.floor(proj.damage * 0.7);
                                        
                                        if (split.hp <= 0) {
                                            char.splits.splice(j, 1);
                                            j--;
                                        }
                                        
                                        if (proj.currentHitTargets.length >= (proj.maxPenetrate || 3)) {
                                            proj.life = 0;
                                            proj.active = false;
                                            break;
                                        }
                                    }
                                }
                            }
                        }
                    }
                    
                    proj.currentHitTargets = stillHitting;
                } else if (proj.type === 'punish') {
                    proj.x += proj.vx * gameSpeed * deltaTime * 60;
                    proj.y += proj.vy * gameSpeed * deltaTime * 60;
                    proj.life -= gameSpeed * deltaTime;
                    
                    if (proj.x < PADDING || proj.x > WIDTH - PADDING ||
                        proj.y < PADDING || proj.y > HEIGHT - PADDING) {
                        proj.life = 0;
                        continue;
                    }
                    
                    if (!proj.hit) {
                        for (const char of characters) {
                            if (char === proj.owner || char.hp <= 0) continue;
                            
                            if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, char.x, char.y, char.radius)) {
                                char.punishTimer = 5;
                                char.punishTarget = proj.owner;
                                char.punishStartAngle = Math.random() * Math.PI * 2;
                                char.stunTimer = 0.5;
                                char.punishRunDistance = 0;
                                char.punishLastX = char.x;
                                char.punishLastY = char.y;
                                
                                floatingTexts.push({
                                    x: char.x,
                                    y: char.y - 25,
                                    text: '罚跑!',
                                    color: '#e74c3c',
                                    alpha: 1,
                                    vy: -0.5,
                                    life: 1,
                                    initialLife: 1
                                });
                                
                                proj.hit = true;
                                proj.life = 0;
                                break;
                            }
                            
                            if (char.splits) {
                                for (let j = 0; j < char.splits.length; j++) {
                                    const split = char.splits[j];
                                    if (checkCircleSquareCollision(proj.x, proj.y, proj.radius, split.x, split.y, char.radius * 0.7)) {
                                        split.punishTimer = 5;
                                        split.punishTarget = proj.owner;
                                        split.punishStartAngle = Math.random() * Math.PI * 2;
                                        split.punishRunDistance = 0;
                                        split.punishLastX = split.x;
                                        split.punishLastY = split.y;
                                        split.vx = 0;
                                        split.vy = 0;
                                        
                                        floatingTexts.push({
                                            x: split.x,
                                            y: split.y - 25,
                                            text: '罚跑!',
                                            color: '#e74c3c',
                                            alpha: 1,
                                            vy: -0.5,
                                            life: 1,
                                            initialLife: 1
                                        });
                                        
                                        proj.hit = true;
                                        proj.life = 0;
                                        break;
                                    }
                                }
                                if (proj.hit) break;
                            }
                        }
                    }
                } else if (proj.type === 'melee') {
                    proj.life -= gameSpeed * deltaTime;
                }
            }
            
            projectiles = projectiles.filter(p => p.life > 0 || p.active);
            
            for (const char of characters) {
                if (char.clawHits) {
                    char.clawHits = char.clawHits.filter(p => projectiles.includes(p));
                }
                if (char.splits) {
                    for (const split of char.splits) {
                        if (split.chalkHits) {
                            split.chalkHits = split.chalkHits.filter(p => projectiles.includes(p));
                        }
                        if (split.pulseHits) {
                            split.pulseHits = split.pulseHits.filter(p => projectiles.includes(p));
                        }
                        if (split.clawHits) {
                            split.clawHits = split.clawHits.filter(p => projectiles.includes(p));
                        }
                        if (split.codeHits) {
                            split.codeHits = split.codeHits.filter(p => projectiles.includes(p));
                        }
                    }
                }
            }
            
            const damageNow = Date.now();
            damageTracker.forEach((record, key) => {
                if (damageNow - record.lastTime >= DAMAGE_COMBINE_THRESHOLD / gameSpeed) {
                    record.floatText.isComplete = true;
                    damageTracker.delete(key);
                }
            });
            
            for (const ft of floatingTexts) {
                if (ft.vx) ft.x += ft.vx * gameSpeed * deltaTime * 60;
                if (ft.vy) ft.y += ft.vy * gameSpeed * deltaTime * 60;
                ft.life -= gameSpeed * deltaTime;
                ft.alpha = Math.max(0, ft.life / (ft.initialLife || 1));
                
                if (ft.currentDamage !== ft.targetDamage) {
                    const diff = ft.targetDamage - ft.currentDamage;
                    ft.currentDamage += diff * 0.2;
                    ft.text = `-${Math.round(ft.currentDamage)}`;
                }
            }
            
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
            
            const spawnInterval = 1000;
            
            for (const queueEntry of nigeSpawnQueue) {
                const now = Date.now();
                if (now - queueEntry.lastSpawnTime < spawnInterval / gameSpeed) continue;
                
                const legionMembers = characters.filter(c => c.name === '尼格军团' && c.legionId === queueEntry.legionId);
                const aliveCount = legionMembers.filter(c => c.hp > 0).length;
                
                if (aliveCount < 3 && queueEntry.totalSent < 10) {
                    let spawnX, spawnY;
                    let attempts = 0;
                    const maxAttempts = 50;
                    
                    do {
                        const side = Math.floor(Math.random() * 4);
                        switch (side) {
                            case 0:
                                spawnX = PADDING - 30;
                                spawnY = PADDING + (HEIGHT - PADDING * 2) * Math.random();
                                break;
                            case 1:
                                spawnX = WIDTH - PADDING + 30;
                                spawnY = PADDING + (HEIGHT - PADDING * 2) * Math.random();
                                break;
                            case 2:
                                spawnX = PADDING + (WIDTH - PADDING * 2) * Math.random();
                                spawnY = PADDING - 30;
                                break;
                            case 3:
                                spawnX = PADDING + (WIDTH - PADDING * 2) * Math.random();
                                spawnY = HEIGHT - PADDING + 30;
                                break;
                        }
                        attempts++;
                    } while (attempts < maxAttempts && characters.some(c => {
                        const dx = c.x - spawnX;
                        const dy = c.y - spawnY;
                        return Math.sqrt(dx * dx + dy * dy) < 80;
                    }));
                    
                    const newSoldier = new NiGeJunTuan(
                        spawnX,
                        spawnY,
                        queueEntry.team === 'red' ? '#e74c3c' : '#3498db',
                        queueEntry.team,
                        characters.length
                    );
                    newSoldier.legionId = queueEntry.legionId;
                    newSoldier.soldierIndex = queueEntry.totalSent;
                    
                    const centerX = WIDTH / 2;
                    const centerY = HEIGHT / 2;
                    const dx = centerX - spawnX;
                    const dy = centerY - spawnY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        newSoldier.vx = (dx / dist) * newSoldier.speed;
                        newSoldier.vy = (dy / dist) * newSoldier.speed;
                    }
                    
                    normalizeVelocity(newSoldier);
                    
                    characters.push(newSoldier);
                    queueEntry.totalSent++;
                    queueEntry.lastSpawnTime = now;
                }
            }
            
            const redAlive = characters.filter(c => c.team === 'red' && c.hp > 0).length;
            const blueAlive = characters.filter(c => c.team === 'blue' && c.hp > 0).length;
            
            const redChar = characters.find(c => c.team === 'red');
            const blueChar = characters.find(c => c.team === 'blue');
            
            let redHp = Math.max(0, Math.round(redChar?.hp || 0));
            let blueHp = Math.max(0, Math.round(blueChar?.hp || 0));
            
            const redNigeQueue = nigeSpawnQueue.find(q => q.team === 'red');
            if (redNigeQueue) {
                const redNigeMembers = characters.filter(c => c.name === '尼格军团' && c.team === 'red' && c.hp > 0);
                const aliveHp = redNigeMembers.reduce((sum, c) => sum + c.hp, 0);
                const remainingCount = 10 - redNigeQueue.totalSent;
                redHp = Math.max(0, Math.round(aliveHp + remainingCount * 100));
            }
            
            const blueNigeQueue = nigeSpawnQueue.find(q => q.team === 'blue');
            if (blueNigeQueue) {
                const blueNigeMembers = characters.filter(c => c.name === '尼格军团' && c.team === 'blue' && c.hp > 0);
                const aliveHp = blueNigeMembers.reduce((sum, c) => sum + c.hp, 0);
                const remainingCount = 10 - blueNigeQueue.totalSent;
                blueHp = Math.max(0, Math.round(aliveHp + remainingCount * 100));
            }
            
            if (currentRedChar === 'SHUANGSHENG') {
                redHp = Math.max(0, Math.round(
                    characters.filter(c => c.team === 'red' && c.hp > 0).reduce((sum, c) => sum + c.hp, 0)
                ));
            }
            if (currentBlueChar === 'SHUANGSHENG') {
                blueHp = Math.max(0, Math.round(
                    characters.filter(c => c.team === 'blue' && c.hp > 0).reduce((sum, c) => sum + c.hp, 0)
                ));
            }
            
            document.getElementById('redHpDisplay').textContent = redHp;
            document.getElementById('blueHpDisplay').textContent = blueHp;
            
            const redNigeHasRemaining = nigeSpawnQueue.some(q => q.team === 'red' && q.totalSent < 10);
            const blueNigeHasRemaining = nigeSpawnQueue.some(q => q.team === 'blue' && q.totalSent < 10);
            
            const redStillActive = redAlive > 0 || redNigeHasRemaining;
            const blueStillActive = blueAlive > 0 || blueNigeHasRemaining;
            
            if (characters.length > 0 && (redStillActive === false || blueStillActive === false)) {
                gameOver = true;
                setImmersiveMode(false);
                const winner = redAlive > 0 ? '红方' : '蓝方';
                const winnerChar = characters.find(c => c.hp > 0);
                document.getElementById('gameOverTitle').textContent = `${winner}胜利！`;
                document.getElementById('gameOverInfo').textContent = winnerChar ? `${winnerChar.name} 赢得了胜利！` : '';
                document.getElementById('gameOverOverlay').style.display = 'flex';
                
                if (winner === '红方') {
                    redWinCount++;
                    updateCharRecords(currentRedChar, true);
                    updateCharRecords(currentBlueChar, false);
                } else {
                    blueWinCount++;
                    updateCharRecords(currentBlueChar, true);
                    updateCharRecords(currentRedChar, false);
                }
                document.getElementById('redWinCount').textContent = redWinCount;
                document.getElementById('blueWinCount').textContent = blueWinCount;
                document.getElementById('totalMatchCount').textContent = redWinCount + blueWinCount;
                updateLeaderboard();
                
                if (isAutoTest) {
                    scheduleNextAutoTest();
                }
            }
        }
        
        function togglePause() {
            isPaused = !isPaused;
            document.querySelector('button[onclick="togglePause()"]').textContent = isPaused ? '继续' : '暂停';
        }
        
        function startAutoTest() {
            isAutoTest = true;
            autoTestOriginalSpeed = gameSpeed;
            gameSpeed = 10;
            document.getElementById('speedSlider').value = 10;
            document.getElementById('speedValue').textContent = '10x';
            
            resetRecords();
            
            const charKeys = ['GUITOU', 'BAIDAN', 'MAONAI', 'HEIDAN', 'SHINIAN', 'MABA', 'HEZIHAN', 'DIKE', 'WENSHI', 'SHIBING', 'NIGE', 'PO9', 'LIBERTY', 'TANGSHUI', 'MOFANGZHE', 'SHUANGSHENG'];
            autoTestQueue = [];
            
            for (let i = 0; i < charKeys.length; i++) {
                for (let j = i + 1; j < charKeys.length; j++) {
                    autoTestQueue.push({ red: charKeys[i], blue: charKeys[j] });
                }
            }
            
            autoTestCurrentMatch = 0;
            autoTestCurrentGame = 0;
            
            startNextAutoTestGame();
        }
        
        function startNextAutoTestGame() {
            if (autoTestCurrentMatch >= autoTestQueue.length) {
                finishAutoTest();
                return;
            }
            
            const match = autoTestQueue[autoTestCurrentMatch];
            
            document.querySelector(`input[name="redChar"][value="${match.red}"]`).checked = true;
            document.querySelector(`input[name="blueChar"][value="${match.blue}"]`).checked = true;
            
            document.getElementById('gameOverOverlay').style.display = 'none';
            
            const charClasses = {
                GUITOU: GuiTou,
                BAIDAN: BaiDan,
                MAONAI: MaoNai,
                HEIDAN: HeiDan,
                SHINIAN: ShiNianZhiHou,
                MABA: MaBa,
                HEZIHAN: HeZiHan,
                DIKE: DiKeDeHeiDiao,
                WENSHI: WenShiDaPeng,
                SHIBING: ShiBing,
                TEST: Test,
                NIGE: NiGeJunTuan,
                CHENZHICHONG: ChenZhiChong,
                MOFANGZHE: MoFangZhe,
                PO9: PO9,
                LIBERTY: Liberty,
                TANGSHUI: TangShui,
                SHUANGSHENG: MaoNai
            };
            
            characters = [];
            
            projectiles = [];
            floatingTexts = [];
            gameOver = false;
            
            currentRedChar = match.red;
            currentBlueChar = match.blue;
            
            characters = [];
            nigeSpawnQueue = [];
            
            if (match.red === 'SHUANGSHENG') {
                const mao = new MaoNai(160, 165, '#e74c3c', 'red', characters.length);
                mao.hp = 500;
                mao.maxHp = 500;
                mao.isShuangshengUnit = true;
                normalizeVelocity(mao);
                characters.push(mao);
                
                const liu = new LiuChuanChuan(160, 235, '#e74c3c', 'red', characters.length);
                liu.isShuangshengUnit = true;
                normalizeVelocity(liu);
                characters.push(liu);
            } else if (match.red === 'NIGE') {
                const legionId = ++nigeLegionCounter;
                for (let i = 0; i < 3; i++) {
                    const offsetAngle = (Math.PI * 2 / 3) * i;
                    const offsetX = Math.cos(offsetAngle) * 40;
                    const offsetY = Math.sin(offsetAngle) * 40;
                    const soldier = new NiGeJunTuan(160 + offsetX, 200 + offsetY, '#e74c3c', 'red', characters.length);
                    soldier.legionId = legionId;
                    soldier.soldierIndex = i;
                    characters.push(soldier);
                }
                
                nigeSpawnQueue.push({
                    legionId: legionId,
                    team: 'red',
                    totalSent: 3,
                    lastSpawnTime: Date.now() - 1000
                });
            } else {
                const redChar = new charClasses[match.red](160, 200, '#e74c3c', 'red', 0);
                normalizeVelocity(redChar);
                characters.push(redChar);
            }
            
            if (match.blue === 'SHUANGSHENG') {
                const mao = new MaoNai(240, 165, '#3498db', 'blue', characters.length);
                mao.hp = 500;
                mao.maxHp = 500;
                mao.isShuangshengUnit = true;
                normalizeVelocity(mao);
                characters.push(mao);
                
                const liu = new LiuChuanChuan(240, 235, '#3498db', 'blue', characters.length);
                liu.isShuangshengUnit = true;
                normalizeVelocity(liu);
                characters.push(liu);
            } else if (match.blue === 'NIGE') {
                const legionId = ++nigeLegionCounter;
                for (let i = 0; i < 3; i++) {
                    const offsetAngle = (Math.PI * 2 / 3) * i;
                    const offsetX = Math.cos(offsetAngle) * 40;
                    const offsetY = Math.sin(offsetAngle) * 40;
                    const soldier = new NiGeJunTuan(240 + offsetX, 200 + offsetY, '#3498db', 'blue', characters.length);
                    soldier.legionId = legionId;
                    soldier.soldierIndex = i;
                    characters.push(soldier);
                }
                
                nigeSpawnQueue.push({
                    legionId: legionId,
                    team: 'blue',
                    totalSent: 3,
                    lastSpawnTime: Date.now() - 1000
                });
            } else {
                const blueChar = new charClasses[match.blue](240, 200, '#3498db', 'blue', characters.length);
                normalizeVelocity(blueChar);
                characters.push(blueChar);
            }
            
            for (const char of characters) {
                const speed = char.currentSpeed || char.speed || BASE_SPEED;
                
                do {
                    const currentSpeed = Math.sqrt(char.vx * char.vx + char.vy * char.vy);
                    
                    if (currentSpeed < speed * 0.1 || currentSpeed > speed * 1.1 || 
                        Math.abs(char.vx) < speed * 0.3 || Math.abs(char.vy) < speed * 0.3) {
                        let angle;
                        do {
                            angle = Math.random() * Math.PI * 2;
                        } while (Math.abs(Math.cos(angle)) < 0.3 || Math.abs(Math.sin(angle)) < 0.3);
                        
                        char.vx = Math.cos(angle) * speed;
                        char.vy = Math.sin(angle) * speed;
                    } else {
                        break;
                    }
                } while (true);
            }
        }
        
        function scheduleNextAutoTest() {
            autoTestCurrentGame++;
            
            if (autoTestCurrentGame >= autoTestGamesPerMatch) {
                autoTestCurrentGame = 0;
                autoTestCurrentMatch++;
            }
            
            gameSpeed = 10;
            document.getElementById('speedSlider').value = gameSpeed;
            document.getElementById('speedValue').textContent = gameSpeed + 'x';
            
            setTimeout(() => {
                startNextAutoTestGame();
            }, 200);
        }
        
        function finishAutoTest() {
            isAutoTest = false;
            gameSpeed = autoTestOriginalSpeed;
            document.getElementById('speedSlider').value = autoTestOriginalSpeed;
            document.getElementById('speedValue').textContent = autoTestOriginalSpeed + 'x';
            
            alert('自动测试完成！请查看排行榜结果。');
        }
        
        function updateCharRecords(charKey, isWin) {
            if (charRecords[charKey]) {
                charRecords[charKey].matches++;
                if (isWin) {
                    charRecords[charKey].wins++;
                } else {
                    charRecords[charKey].losses++;
                }
            }
        }
        
        function updateLeaderboard() {
            const body = document.getElementById('leaderboardBody');
            const sorted = Object.values(charRecords).sort((a, b) => {
                const rateA = a.matches > 0 ? a.wins / a.matches : 0;
                const rateB = b.matches > 0 ? b.wins / b.matches : 0;
                return rateB - rateA;
            });
            
            body.innerHTML = sorted.map((record, index) => {
                const rate = record.matches > 0 ? ((record.wins / record.matches) * 100).toFixed(1) : '-';
                return `
                    <div class="leaderboard-row">
                        <span class="lb-col-name">${index === 0 ? '🥇 ' : ''}${record.name}</span>
                        <span class="lb-col">${record.matches}</span>
                        <span class="lb-col">${record.wins}</span>
                        <span class="lb-col">${record.losses}</span>
                        <span class="lb-col">${rate}%</span>
                    </div>
                `;
            }).join('');
        }
        
        function resetRecords() {
            redWinCount = 0;
            blueWinCount = 0;
            document.getElementById('redWinCount').textContent = '0';
            document.getElementById('blueWinCount').textContent = '0';
            document.getElementById('totalMatchCount').textContent = '0';
            
            for (const key in charRecords) {
                charRecords[key].matches = 0;
                charRecords[key].wins = 0;
                charRecords[key].losses = 0;
            }
            updateLeaderboard();
        }
        
        function gameLoop() {
            const currentTime = performance.now();
            deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            if (!isPaused) {
                update();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function startGame() {
            document.getElementById('gameOverOverlay').style.display = 'none';
            
            const redType = document.querySelector('input[name="redChar"]:checked').value;
            const blueType = document.querySelector('input[name="blueChar"]:checked').value;
            
            currentRedChar = redType;
            currentBlueChar = blueType;
            
            const charClasses = {
                GUITOU: GuiTou,
                BAIDAN: BaiDan,
                MAONAI: MaoNai,
                HEIDAN: HeiDan,
                SHINIAN: ShiNianZhiHou,
                MABA: MaBa,
                HEZIHAN: HeZiHan,
                DIKE: DiKeDeHeiDiao,
                WENSHI: WenShiDaPeng,
                SHIBING: ShiBing,
                TEST: Test,
                NIGE: NiGeJunTuan,
                CHENZHICHONG: ChenZhiChong,
                MOFANGZHE: MoFangZhe,
                PO9: PO9,
                LIBERTY: Liberty,
                TANGSHUI: TangShui,
                SHUANGSHENG: MaoNai
            };
            
            const RedCharClass = charClasses[redType];
            const BlueCharClass = charClasses[blueType];
            
            const mapWidth = WIDTH - PADDING * 2;
            const mapHeight = HEIGHT - PADDING * 2;
            
            characters = [];
            nigeSpawnQueue = [];
            
            if (redType === 'SHUANGSHENG') {
                const baseX = PADDING + mapWidth * 0.25;
                const baseY = PADDING + mapHeight / 2;
                const mao = new MaoNai(baseX, baseY - 35, '#e74c3c', 'red', characters.length);
                mao.hp = 500;
                mao.maxHp = 500;
                mao.isShuangshengUnit = true;
                normalizeVelocity(mao);
                characters.push(mao);
                
                const liu = new LiuChuanChuan(baseX, baseY + 35, '#e74c3c', 'red', characters.length);
                liu.isShuangshengUnit = true;
                normalizeVelocity(liu);
                characters.push(liu);
            } else if (redType === 'NIGE') {
                const legionId = ++nigeLegionCounter;
                for (let i = 0; i < 3; i++) {
                    const offsetAngle = (Math.PI * 2 / 3) * i;
                    const offsetX = Math.cos(offsetAngle) * 40;
                    const offsetY = Math.sin(offsetAngle) * 40;
                    const soldier = new NiGeJunTuan(
                        PADDING + mapWidth * 0.25 + offsetX,
                        PADDING + mapHeight / 2 + offsetY,
                        '#e74c3c', 'red', characters.length
                    );
                    soldier.legionId = legionId;
                    soldier.soldierIndex = i;
                    characters.push(soldier);
                }
                
                nigeSpawnQueue.push({
                    legionId: legionId,
                    team: 'red',
                    totalSent: 3,
                    lastSpawnTime: Date.now() - 1000
                });
            } else {
                characters.push(new RedCharClass(PADDING + mapWidth * 0.25, PADDING + mapHeight / 2, '#e74c3c', 'red', 0));
            }
            
            if (blueType === 'SHUANGSHENG') {
                const baseX = PADDING + mapWidth * 0.75;
                const baseY = PADDING + mapHeight / 2;
                const mao = new MaoNai(baseX, baseY - 35, '#3498db', 'blue', characters.length);
                mao.hp = 500;
                mao.maxHp = 500;
                mao.isShuangshengUnit = true;
                normalizeVelocity(mao);
                characters.push(mao);
                
                const liu = new LiuChuanChuan(baseX, baseY + 35, '#3498db', 'blue', characters.length);
                liu.isShuangshengUnit = true;
                normalizeVelocity(liu);
                characters.push(liu);
            } else if (blueType === 'NIGE') {
                const legionId = ++nigeLegionCounter;
                for (let i = 0; i < 3; i++) {
                    const offsetAngle = (Math.PI * 2 / 3) * i;
                    const offsetX = Math.cos(offsetAngle) * 40;
                    const offsetY = Math.sin(offsetAngle) * 40;
                    const soldier = new NiGeJunTuan(
                        PADDING + mapWidth * 0.75 + offsetX,
                        PADDING + mapHeight / 2 + offsetY,
                        '#3498db', 'blue', characters.length
                    );
                    soldier.legionId = legionId;
                    soldier.soldierIndex = i;
                    characters.push(soldier);
                }
                
                nigeSpawnQueue.push({
                    legionId: legionId,
                    team: 'blue',
                    totalSent: 3,
                    lastSpawnTime: Date.now() - 1000
                });
            } else {
                characters.push(new BlueCharClass(PADDING + mapWidth * 0.75, PADDING + mapHeight / 2, '#3498db', 'blue', characters.length));
            }
            
            const now = Date.now();
            for (const char of characters) {
                if (char.lastCrashTime !== undefined) {
                    char.lastCrashTime = now;
                }
            }
            
            for (const char of characters) {
                const speed = char.currentSpeed || char.speed || BASE_SPEED;
                
                do {
                    const currentSpeed = Math.sqrt(char.vx * char.vx + char.vy * char.vy);
                    
                    if (currentSpeed < speed * 0.1 || currentSpeed > speed * 1.1 || 
                        Math.abs(char.vx) < speed * 0.3 || Math.abs(char.vy) < speed * 0.3) {
                        let angle;
                        do {
                            angle = Math.random() * Math.PI * 2;
                        } while (Math.abs(Math.cos(angle)) < 0.3 || Math.abs(Math.sin(angle)) < 0.3);
                        
                        char.vx = Math.cos(angle) * speed;
                        char.vy = Math.sin(angle) * speed;
                    } else {
                        break;
                    }
                } while (true);
            }
            
            projectiles = [];
            floatingTexts = [];
            gameOver = false;
            
            document.getElementById('redHpDisplay').textContent = 1000;
            document.getElementById('blueHpDisplay').textContent = 1000;
        }
        
        gameLoop();
    </script>
</body>
