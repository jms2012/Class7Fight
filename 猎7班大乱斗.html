                this.sugar = Math.min(this.maxSugar, this.sugar + 6 * gameSpeed * deltaTime);
                this.updateArmor(floatTexts);
                if (this.armorTimer > 0) {
                    this.armorTimer = Math.max(0, this.armorTimer - gameSpeed * deltaTime);

                    this.armorHealAccum += gameSpeed * deltaTime;
                    while (this.armorHealAccum >= 1) {
                        this.armorHealAccum -= 1;
                        const before = this.hp;
                        this.hp = Math.min(this.maxHp, this.hp + this.armorHealPerTick);
                        const healed = this.hp - before;
                        if (healed > 0) showDamageText(this, -healed, '#2ecc71', this);
                    }
                }
                
                for (const trail of this.dashTrail) trail.life -= gameSpeed * deltaTime;
                this.dashTrail = this.dashTrail.filter(t => t.life > 0);
                
                if (this.isDashing) {
                    if (Date.now() - this.dashStartTime >= this.dashDuration / gameSpeed) {
                        this.finishDash(allChars, floatTexts);
                        this.checkCollision(allChars);
                        this.move();
                    } else {
                        this.moveDash();
                    }
                } else {
                    this.tryDash(allChars);
                    if (this.isDashing) {
                        this.moveDash();
                    } else {
                        this.attack(allChars, projList, floatTexts);
                        this.checkCollision(allChars);
                        this.move();
                    }
                }
                
                if (this.slashFx > 0) this.slashFx = Math.max(0, this.slashFx - gameSpeed * deltaTime);
            }
            
            tryDash(chars) {
                const now = Date.now();
                if (now - this.lastDashTime < 3500 / gameSpeed) return;
                
                let closestEnemy = null;
                let minDist = Infinity;
                for (const c of chars) {
                    if (c === this || c.hp <= 0 || c.team === this.team) continue;
                    const dist = distance(this.x, this.y, c.x, c.y);
                    if (dist < minDist) {
                        minDist = dist;
                        closestEnemy = c;
                    }
                }
                
                // 只在敌人处于中距离时冲刺；贴身时保留冷却
                if (!closestEnemy || minDist <= 60 || minDist > 300) return;
                
                this.lastDashTime = now;
                this.isDashing = true;
                this.dashStartTime = now;
                this.dashAngle = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                this.dashVx = Math.cos(this.dashAngle) * this.speed * 3.2;
                this.dashVy = Math.sin(this.dashAngle) * this.speed * 3.2;
            }
            
            moveDash() {
                this.dashTrail.push({ x: this.x, y: this.y, life: 0.28 });
                if (this.dashTrail.length > 8) this.dashTrail.shift();
                
                this.x += this.dashVx * gameSpeed * deltaTime * 60;
                this.y += this.dashVy * gameSpeed * deltaTime * 60;
                
                if (this.x < PADDING + this.radius || this.x > WIDTH - PADDING - this.radius) {
                    this.dashVx = 0;
                    this.x = Math.max(PADDING + this.radius, Math.min(WIDTH - PADDING - this.radius, this.x));
                }
                if (this.y < PADDING + this.radius || this.y > HEIGHT - PADDING - this.radius) {
                    this.dashVy = 0;
                    this.y = Math.max(PADDING + this.radius, Math.min(HEIGHT - PADDING - this.radius, this.y));
                }
            }
            
            finishDash(chars, floatTexts) {
                this.isDashing = false;
                this.dashStartTime = 0;
                this.dashVx = 0;
                this.dashVy = 0;
                this.vx = Math.cos(this.dashAngle) * this.speed;
                this.vy = Math.sin(this.dashAngle) * this.speed;
                normalizeVelocity(this);
                
                const slashRange = this.getAttackRange() + 20;
                const damage = (28 + this.sugar * 0.22) * 1.5;
                
                for (const c of chars) {
                    if (c === this || c.hp <= 0 || c.team === this.team) continue;
                    
                    const dist = distance(this.x, this.y, c.x, c.y);
                    if (dist > slashRange + c.radius) continue;
                    
                    const angleToTarget = Math.atan2(c.y - this.y, c.x - this.x);
                    const angleDiff = Math.abs(Math.atan2(
                        Math.sin(angleToTarget - this.dashAngle),
                        Math.cos(angleToTarget - this.dashAngle)
                    ));
                    if (angleDiff > 0.85) continue;
                    
                    const result = c.takeDamage(damage, this, floatTexts);
                    showDamageText(c, result.damage, '#e74c3c', this);
                    this.applySugarStacks(c, floatTexts);
                }
                
                this.slashAngle = this.dashAngle;
                this.slashRange = slashRange;
                this.slashFx = 0.3;
            }
            
            updateArmor(floatTexts) {
                if (this.armorTimer > 0) return;
                
                const now = Date.now();
                if (now - this.lastArmorTime < this.armorCooldown / gameSpeed) return;
                
                this.armorTimer = this.armorDuration;
                this.armorHealAccum = 0;
                this.lastArmorTime = now;
                
                floatTexts.push({
                    x: this.x,
                    y: this.y - this.radius - 20,
                    text: '铠甲合体！',
                    color: '#f1c40f',
                    alpha: 1,
                    vy: -0.5,
                    life: 1.1,
                    initialLife: 1.1
                });
            }
            
            getAttackRange() {
                return 45 + this.sugar * 0.3;
            }
            
            attack(chars, projList, floatTexts) {
                const now = Date.now();
                if (now - this.lastAttackTime < this.attackInterval / gameSpeed) return;
                
                const attackRange = this.getAttackRange();
                let closestEnemy = null;
                let minDist = Infinity;
                
                for (const c of chars) {
                    if (c === this || c.hp <= 0 || c.team === this.team) continue;
                    const dist = distance(this.x, this.y, c.x, c.y);
                    if (dist <= attackRange && dist < minDist) {
                        minDist = dist;
                        closestEnemy = c;
                    }
                }
                
                if (!closestEnemy) return;
                
                this.lastAttackTime = now;
                
                const swingAngle = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                const damage = 28 + this.sugar * 0.22;
                
                // 挥砍：朝目标方向劈出扇形，命中范围内所有敌人
                for (const c of chars) {
                    if (c === this || c.hp <= 0 || c.team === this.team) continue;
                    
                    const dist = distance(this.x, this.y, c.x, c.y);
                    if (dist > attackRange + c.radius) continue;
                    
                    const angleToTarget = Math.atan2(c.y - this.y, c.x - this.x);
                    const angleDiff = Math.abs(Math.atan2(
                        Math.sin(angleToTarget - swingAngle),
                        Math.cos(angleToTarget - swingAngle)
                    ));
                    if (angleDiff > 0.6) continue;
                    
                    const result = c.takeDamage(damage, this, floatTexts);
                    showDamageText(c, result.damage, '#e74c3c', this);
                    this.applySugarStacks(c, floatTexts);
                }
                
                this.slashAngle = swingAngle;
                this.slashRange = attackRange;
                this.slashFx = 0.25;
            }
            
            gainSugar(amount) {
                this.sugar = Math.max(0, Math.min(this.maxSugar, this.sugar + amount));
            }
            
            applySugarStacks(target, floatTexts) {
                if (target.hp <= 0) return;
                
                const stacksToAdd = this.sugar >= 90 ? 2 : 1;
                target.sugarStacks = Math.min(4, (target.sugarStacks || 0) + stacksToAdd);
                target.sugarSource = this;
                target.lastSugarStackTime = Date.now();
                if (!target.lastSugarTick) target.lastSugarTick = Date.now();
                
                this.gainSugar(12);
                
                floatTexts.push({
                    x: target.x,
                    y: target.y - target.radius - 12,
                    text: `糖渍 ${target.sugarStacks}/4`,
                    color: '#e67e22',
                    alpha: 1,
                    vy: -0.5,
                    life: 0.8,
                    initialLife: 0.8
                });
                
                if (target.sugarStacks >= 4) {
                    target.sugarStacks = 0;
                    target.lastSugarTick = 0;
                    target.stunTimer = Math.max(target.stunTimer || 0, 1.2);
                    
                    const result = target.takeDamage(45, this, floatTexts);
                    showDamageText(target, result.damage, '#e74c3c', this);
                    
                    this.gainSugar(-40);
                    
                    floatTexts.push({
                        x: target.x,
                        y: target.y - 45,
                        text: '结晶！',
                        color: '#f39c12',
                        alpha: 1,
                        vy: -0.5,
                        life: 1.1,
                        initialLife: 1.1
                    });
                }
            }
            
            checkCollision(chars) {
                for (const c of chars) {
                    if (c === this || c.hp <= 0 || c.team === this.team) continue;
                    if (c.id > this.id) continue;
                    
                    const collisionResult = checkSquareCollision(this, c);
                    if (collisionResult.collision) {
                        const nx = collisionResult.nx;
                        const ny = collisionResult.ny;
                        
                        reflectVelocity(this, nx, ny);
                        reflectVelocity(c, -nx, -ny);
                        
                        const overlap = collisionResult.overlap + 0.5;
                        this.x -= nx * overlap * 0.5;
                        this.y -= ny * overlap * 0.5;
                        c.x += nx * overlap * 0.5;
                        c.y += ny * overlap * 0.5;
                        
                        clampToBounds(this);
                        clampToBounds(c);
                        
                        break;
                    }
                }
            }
            
            move() {
                const sugarSpeed = 1.1 - this.sugar * 0.0025;
                const mag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (mag > 0.001) {
                    this.x += (this.vx / mag) * this.speed * sugarSpeed * gameSpeed * deltaTime * 60;
                    this.y += (this.vy / mag) * this.speed * sugarSpeed * gameSpeed * deltaTime * 60;
                }
                
                if (this.x < PADDING + this.radius || this.x > WIDTH - PADDING - this.radius) {
                    this.vx *= -1;
                    this.x = Math.max(PADDING + this.radius, Math.min(WIDTH - PADDING - this.radius, this.x));
                }
                if (this.y < PADDING + this.radius || this.y > HEIGHT - PADDING - this.radius) {
                    this.vy *= -1;
                    this.y = Math.max(PADDING + this.radius, Math.min(HEIGHT - PADDING - this.radius, this.y));
                }
                
                normalizeVelocity(this);
            }
            
            takeDamage(damage, attacker, floatTexts) {
                if (this.timeFieldEffect > 0) {
                    damage = damage * 1.5;
                }
                
                if (this.armorTimer > 0) {
                    damage = damage * 0.55;
                }
                
                if (this.damageReduction > 0) {
                    damage = damage * 0.9;
                }
                
                this.hp -= damage;
                if (this.hp <= 0) {
                    this.hp = 0;
                    return { killed: true, damage: damage };
                }
                return { killed: false, damage: damage };
            }
            
            draw(ctx) {
                if (this.hp <= 0) return;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (this.slashFx > 0) {
                    const progress = 1 - this.slashFx / 0.25;
                    const current = this.slashAngle - 0.6 + progress * 1.2;
                    const slashRange = this.slashRange || 45;
                    
                    ctx.strokeStyle = `rgba(230,126,34,${1 - progress})`;
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.arc(0, 0, slashRange * 0.9, this.slashAngle - 0.6, this.slashAngle + 0.6);
                    ctx.stroke();
                    
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(current) * slashRange, Math.sin(current) * slashRange);
                    ctx.stroke();
                }
                
                for (const trail of this.dashTrail) {
                    ctx.fillStyle = `rgba(230,126,34,${(trail.life / 0.28) * 0.35})`;
                    ctx.fillRect(
                        trail.x - this.x - this.radius * 0.5,
                        trail.y - this.y - this.radius * 0.5,
                        this.radius,
                        this.radius
                    );
                }
                
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                
                if (this.armorTimer > 0) {
                    ctx.fillStyle = 'rgba(241,196,15,0.35)';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 0.95, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(241,196,15,0.9)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(this.name, 0, -this.radius - 5);
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Arial';
                ctx.fillText(`${Math.round(this.hp)}/${this.maxHp}`, 0, -this.radius - 15);
                
                ctx.restore();
            }
        }
        
        class DengJie {
            constructor(x, y, color, team, id) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.team = team;
                this.id = id;
                this.name = '邓杰';
                this.radius = 20;
                this.hp = 1000;
                this.maxHp = 1000;
                this.speed = BASE_SPEED;
                
                this.moveAngle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(this.moveAngle) * this.speed;
                this.vy = Math.sin(this.moveAngle) * this.speed;
                normalizeVelocity(this);
                
                this.lastAttackTime = Date.now();
                this.attackInterval = 800;
                this.lastCollisionTime = Date.now();
                this.collisionCooldown = 1000;
                
                this.isTyping = false;
                this.currentExpression = '';
                this.typingIndex = 0;
                this.lastTypeTime = 0;
                this.typeSpeed = 90;
                this.pendingValue = 0;
                
                this.expression = '';
                this.expressionUntil = 0;
                
                this.target = null;
            }
            
            update(allChars, projList, floatTexts) {
                if (this.hp <= 0) return;
                
                this.findTarget(allChars);
                this.checkCollision(allChars);
                this.attack(projList);
                this.move();
            }
            
            findTarget(chars) {
                this.target = findNearestEnemy(this, chars);
            }
            
            // 血量越低，数字区间越大、乘号权重越高，更容易算出大数
            getExpressionRange() {
                const hpRatio = this.maxHp > 0 ? this.hp / this.maxHp : 0;
                if (hpRatio < 0.3) {
                    return { min: 12, max: 36, plus: 0.22, times: 0.60 };
                }
                if (hpRatio < 0.6) {
                    return { min: 8, max: 24, plus: 0.30, times: 0.45 };
                }
                return { min: 5, max: 15, plus: 0.40, times: 0.30 };
            }
            
            // 像低客的黑调一样，把算式一个字一个字敲出来，敲完才发射
            attack(projList) {
                const now = Date.now();
                
                if (this.isTyping) {
                    if (now - this.lastTypeTime < this.typeSpeed / gameSpeed) return;
                    this.typingIndex++;
                    this.lastTypeTime = now;
                    
                    if (this.typingIndex >= this.currentExpression.length) {
                        this.fire(projList, now);
                        this.isTyping = false;
                        this.currentExpression = '';
                        this.typingIndex = 0;
                        this.lastAttackTime = now;
                    }
                    return;
                }
                
                if (now - this.lastAttackTime < this.attackInterval / gameSpeed) return;
                if (!this.target) return;
                
                this.startTyping(now);
            }
            
            startTyping(now) {
                const range = this.getExpressionRange();
                const rollInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
                const a = rollInt(range.min, range.max);
                const b = rollInt(range.min, range.max);
                
                const roll = Math.random();
                let op;
                let value;
                let left = a;
                let right = b;
                if (roll < range.plus) {
                    op = '+';
                    value = left + right;
                } else if (roll < range.plus + range.times) {
                    op = '×';
                    value = left * right;
                } else {
                    // 两个数字仍取正数，但按随机顺序相减，因此计算结果可能为负（负伤害会治疗敌人）
                    op = '-';
                    left = a;
                    right = b;
                    if (left === right) {
                        right = right < range.max ? right + 1 : right - 1;
                    }
                    value = left - right;
                }
                
                this.currentExpression = `${left} ${op} ${right} = ${value}`;
                this.pendingValue = value;
                this.typingIndex = 0;
                this.lastTypeTime = now;
                this.isTyping = true;
            }
            
            fire(projList, now) {
                this.expression = this.currentExpression;
                this.expressionUntil = now + 700;
                
                if (!this.target) return;
                
                const value = this.pendingValue;
                const angle = Math.atan2(this.target.y - this.y, this.target.x - this.x) + (Math.random() - 0.5) * 0.12;
                const bulletRadius = value >= 100 ? 7 : (value >= 50 ? 5 : 4);
                const bulletColor = value < 0 ? '#2ecc71' : (value >= 100 ? '#e74c3c' : '#f39c12');
                
                projList.push({
                    type: 'bullet',
                    x: this.x,
                    y: this.y,
                    vx: Math.cos(angle) * 7,
                    vy: Math.sin(angle) * 7,
                    damage: value,
                    owner: this,
                    radius: bulletRadius,
                    color: bulletColor,
                    bounces: 0,
                    maxBounces: 0,
                    canBounce: false,
                    maxPenetrate: 1,
                    trail: [],
                    maxTrail: 20,
                    active: true
                });
            }
            
            checkCollision(chars) {
                for (const c of chars) {
                    if (c === this || c.hp <= 0 || c.team === this.team) continue;
                    if (c.id > this.id) continue;
                    
                    const collisionResult = checkSquareCollision(this, c);
                    if (collisionResult.collision) {
                        const nx = collisionResult.nx;
                        const ny = collisionResult.ny;
                        
                        reflectVelocity(this, nx, ny);
                        reflectVelocity(c, -nx, -ny);
                        
                        const overlap = collisionResult.overlap + 0.5;
                        this.x -= nx * overlap * 0.5;
                        this.y -= ny * overlap * 0.5;
                        c.x += nx * overlap * 0.5;
                        c.y += ny * overlap * 0.5;
                        
                        clampToBounds(this);
                        clampToBounds(c);
                        
                        break;
                    }
                }
            }
            
            move() {
                const mag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (mag > 0.001) {
                    this.x += (this.vx / mag) * this.speed * gameSpeed * deltaTime * 60;
                    this.y += (this.vy / mag) * this.speed * gameSpeed * deltaTime * 60;
                }
                
                if (this.x < PADDING + this.radius || this.x > WIDTH - PADDING - this.radius) {
                    this.vx *= -1;
                    this.x = Math.max(PADDING + this.radius, Math.min(WIDTH - PADDING - this.radius, this.x));
                }
                if (this.y < PADDING + this.radius || this.y > HEIGHT - PADDING - this.radius) {
                    this.vy *= -1;
                    this.y = Math.max(PADDING + this.radius, Math.min(HEIGHT - PADDING - this.radius, this.y));
                }
                
                normalizeVelocity(this);
            }
            
            takeDamage(damage, attacker, floatTexts) {
                if (this.timeFieldEffect > 0) {
                    damage = damage * 1.5;
                }
                
                if (this.damageReduction > 0) {
                    damage = damage * 0.9;
                }
                
                this.hp -= damage;
                if (this.hp > this.maxHp) {
                    this.hp = this.maxHp;
                }
                if (this.hp <= 0) {
                    this.hp = 0;
                    return { killed: true, damage: damage };
                }
                return { killed: false, damage: damage };
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(this.name, 0, -this.radius - 5);
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Arial';
                ctx.fillText(`${Math.round(this.hp)}/${this.maxHp}`, 0, -this.radius - 15);
                
                if (this.isTyping && this.currentExpression) {
                    const typedText = this.currentExpression.substring(0, this.typingIndex + 1);
                    ctx.fillStyle = '#8e44ad';
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText(typedText + '|', 0, -this.radius - 26);
                } else if (this.expression && Date.now() < this.expressionUntil) {
                    ctx.fillStyle = '#8e44ad';
                    ctx.font = 'bold 9px Arial';
                    ctx.fillText(this.expression, 0, -this.radius - 26);
                }
                
                ctx.restore();
            }
        }
        
        function draw() {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            if (immersiveMode) {
                const aliveChars = characters.filter(c => c.hp > 0);
                if (aliveChars.length > 0) {
                    const avgX = aliveChars.reduce((sum, c) => sum + c.x, 0) / aliveChars.length;
                    const avgY = aliveChars.reduce((sum, c) => sum + c.y, 0) / aliveChars.length;
                    cameraX = WIDTH / 2 - avgX;
                    cameraY = HEIGHT / 2 - avgY;
                    
                    cameraX = Math.max(0, Math.min(cameraX, WIDTH - (WIDTH - PADDING * 2)));
                    cameraY = Math.max(0, Math.min(cameraY, HEIGHT - (HEIGHT - PADDING * 2)));
                }
                
                ctx.save();
                ctx.translate(cameraX, cameraY);
            }
            
            ctx.strokeStyle = '#4a6fa5';
            ctx.lineWidth = 3;
            ctx.strokeRect(PADDING, PADDING, WIDTH - PADDING * 2, HEIGHT - PADDING * 2);
            
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(WIDTH / 2, PADDING);
            ctx.lineTo(WIDTH / 2, HEIGHT - PADDING);
            ctx.stroke();
            ctx.setLineDash([]);
            
            for (const proj of projectiles) {
                if (proj.type === 'laser') {
                    ctx.save();
                    ctx.globalAlpha = proj.life / 0.25;
                    ctx.strokeStyle = proj.color;
                    ctx.lineWidth = proj.width;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    
                    const angle = Math.atan2(proj.targetY - proj.y, proj.targetX - proj.x);
                    const farX = proj.x + Math.cos(angle) * 1000;
                    const farY = proj.y + Math.sin(angle) * 1000;
                    
                    ctx.moveTo(proj.x, proj.y);
                    ctx.lineTo(farX, farY);
                    ctx.stroke();
                    ctx.restore();
                } else if (proj.type === 'chalk') {
                    ctx.save();
                    ctx.fillStyle = proj.color;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#999';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.restore();
                } else if (proj.type === 'claw') {
                    ctx.save();
                    ctx.globalAlpha = proj.life / 0.25;
                    ctx.strokeStyle = proj.color;
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(proj.x, proj.y);
                    ctx.lineTo(proj.endX, proj.endY);
                    ctx.stroke();
                    ctx.restore();
                } else if (proj.type === 'timePulse') {
                    ctx.save();
                    ctx.globalAlpha = proj.life / 1;
                    ctx.fillStyle = proj.color || '#9b59b6';
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.radius * 0.6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                } else if (proj.type === 'code') {
                    ctx.save();
                    ctx.translate(proj.x, proj.y);
                    ctx.rotate(Math.atan2(proj.vy, proj.vx));
                    
                    ctx.font = 'bold 12px Arial';
                    ctx.fillStyle = proj.color;
                    ctx.textAlign = 'center';
                    
                    const text = proj.text || '{}';
                    const displayText = text.length > 15 ? text.substring(0, 15) + '...' : text;
                    ctx.fillText(displayText, 0, 4);
                    ctx.restore();
                } else if (proj.type === 'whistle') {
                    ctx.save();
                    ctx.fillStyle = proj.color;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(proj.text, proj.x, proj.y);
                    ctx.restore();
                } else if (proj.type === 'punish') {
                    ctx.save();
                    ctx.fillStyle = proj.color;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(proj.text, proj.x, proj.y);
                    ctx.restore();
                } else if (proj.type === 'whistleWave') {
                    ctx.save();
                    const progress = 1 - proj.life / 0.5;
                    const currentRadius = proj.radius + (proj.maxRadius - proj.radius) * progress;
                    ctx.globalAlpha = 1 - progress;
                    ctx.strokeStyle = proj.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, currentRadius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                } else if (proj.type === 'melee') {
                    ctx.save();
                    ctx.globalAlpha = proj.life / 0.15;
                    ctx.strokeStyle = proj.color;
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(proj.x, proj.y);
                    ctx.lineTo(proj.endX, proj.endY);
                    ctx.stroke();
                    
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#fff';
                    ctx.beginPath();
                    ctx.moveTo(proj.x, proj.y);
                    ctx.lineTo(proj.endX, proj.endY);
                    ctx.stroke();
                    ctx.restore();
                } else if (proj.type === 'question') {
                    ctx.save();
                    ctx.fillStyle = proj.color;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('?', proj.x, proj.y);
                    ctx.restore();
                } else if (proj.type === 'bullet') {
                    ctx.save();
                    
                    if (proj.trail && proj.trail.length > 1) {
                        for (let i = 1; i < proj.trail.length; i++) {
                            const alpha = (i / proj.trail.length) * 0.5;
                            ctx.globalAlpha = alpha;
                            ctx.strokeStyle = proj.color;
                            ctx.lineWidth = proj.radius * (i / proj.trail.length);
                            ctx.beginPath();
                            ctx.moveTo(proj.trail[i - 1].x, proj.trail[i - 1].y);
                            ctx.lineTo(proj.trail[i].x, proj.trail[i].y);
                            ctx.stroke();
                        }
                    }
                    
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = proj.color;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (proj.type === 'tracking') {
                    ctx.save();
                    
                    if (proj.trail && proj.trail.length > 1) {
                        for (let i = 1; i < proj.trail.length; i++) {
                            const alpha = (i / proj.trail.length) * 0.5;
                            ctx.globalAlpha = alpha;
                            ctx.strokeStyle = proj.color;
                            ctx.lineWidth = proj.radius * (i / proj.trail.length);
                            ctx.beginPath();
                            ctx.moveTo(proj.trail[i - 1].x, proj.trail[i - 1].y);
                            ctx.lineTo(proj.trail[i].x, proj.trail[i].y);
                            ctx.stroke();
                        }
                    }
                    
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = proj.color;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = '#f1c40f';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, proj.radius + 3, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }
            
            for (const char of characters) {
                if (char.hp <= 0) continue;
                
                if (char.timeFieldActive) {
                    const alpha = char.timeFieldDuration / 60;
                    ctx.fillStyle = `rgba(155, 89, 182, ${alpha * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(char.timeFieldX, char.timeFieldY, char.timeFieldRadius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = `rgba(155, 89, 182, ${alpha})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(char.timeFieldX, char.timeFieldY, char.timeFieldRadius, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.strokeStyle = `rgba(155, 89, 182, ${alpha * 0.5})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(char.timeFieldX, char.timeFieldY, char.timeFieldRadius * 0.7, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.arc(char.timeFieldX, char.timeFieldY, char.timeFieldRadius * 0.4, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                for (const frag of (char.memoryFragments || [])) {
                    if (frag.color) {
                        const r = parseInt(frag.color.slice(1, 3), 16);
                        const g = parseInt(frag.color.slice(3, 5), 16);
                        const b = parseInt(frag.color.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.6)`;
                    } else {
                        ctx.fillStyle = 'rgba(155, 89, 182, 0.6)';
                    }
                    ctx.beginPath();
                    ctx.arc(frag.x, frag.y, frag.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            for (const char of characters) {
                if (char.hp <= 0) continue;
                
                if (char.splits && char.splits.length > 0) {
                    for (const split of char.splits) {
                        ctx.save();
                        ctx.translate(split.x, split.y);
                        ctx.globalAlpha = 0.6;
                        ctx.fillStyle = char.color;
                        ctx.fillRect(-char.radius * 0.7, -char.radius * 0.7, char.radius * 1.4, char.radius * 1.4);
                        
                        ctx.fillStyle = '#000';
                        ctx.font = 'bold 8px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${Math.round(split.hp)}/${split.maxHp}`, 0, -char.radius * 0.7 - 3);
                        ctx.restore();
                    }
                }
                
                if (char.currentForm && char.isTransforming) {
                    // 变身后直接调用被模仿角色自己的 draw()，蓄力条、体能等专属显示都能正确呈现
                    char.draw(ctx);
                } else {
                ctx.save();
                ctx.translate(char.x, char.y);
                if (char.isCloaked) ctx.globalAlpha = 0.35;
                ctx.fillStyle = char.color;
                ctx.fillRect(-char.radius, -char.radius, char.radius * 2, char.radius * 2);
                ctx.globalAlpha = 1;
                
                if (char.name === '20') {
                    // 上升/下砸阶段的落点指示圈
                    if (char.slamState === 'ascend' || char.slamState === 'dive') {
                        ctx.strokeStyle = 'rgba(231, 76, 60, 0.85)';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.arc(char.slamImpactX - char.x, char.slamImpactY - char.y, char.slamRadius, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    
                    // 落地冲击波
                    if (char.slamFx > 0) {
                        const progress = 1 - char.slamFx / 0.45;
                        ctx.strokeStyle = `rgba(255, 255, 255, ${1 - progress})`;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(0, 0, char.radius + 70 * progress, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                
                if (char.damageReduction > 0) {
                    ctx.strokeStyle = '#2ecc71';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius + 5, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.strokeStyle = 'rgba(46, 204, 113, 0.5)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius + 8, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                if (char.isAssaulting && char.name === '陈治宏') {
                    const pulse = Math.sin(Date.now() / 100) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(255, 242, 0, ${pulse * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius + 15, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = `rgba(255, 242, 0, ${pulse})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius + 12, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                if (char.name === '九氧化一磷') {
                    const spin = char.oxygenSpin || 0;
                    for (let i = 0; i < 9; i++) {
                        const a = spin + (Math.PI * 2 / 9) * i;
                        const ox = Math.cos(a) * (char.radius + 10);
                        const oy = Math.sin(a) * (char.radius + 10);
                        const filled = i < (char.oxygenStacks || 0);
                        ctx.beginPath();
                        ctx.arc(ox, oy, filled ? 4 : 2, 0, Math.PI * 2);
                        ctx.fillStyle = filled ? '#dfff00' : 'rgba(255,255,255,0.55)';
                        ctx.fill();
                    }
                    
                    ctx.fillStyle = 'rgba(223,255,0,0.85)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 7 + (char.oxygenStacks || 0) * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    if (char.detonateFx > 0) {
                        const progress = 1 - char.detonateFx / 0.6;
                        ctx.strokeStyle = `rgba(255,255,255,${1 - progress})`;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(0, 0, 30 + 100 * progress, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                
                if (char.name === 'Liberty' && char.isCloaked) {
                    ctx.strokeStyle = 'rgba(155,89,182,0.85)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius + 9, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    if (char.cloakFx > 0) {
                        const progress = 1 - char.cloakFx / 0.5;
                        ctx.strokeStyle = `rgba(155,89,182,${1 - progress})`;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, char.radius + 10 + 90 * progress, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                
                if (char.isRedHot) {
                    ctx.fillStyle = 'rgba(231,76,60,0.18)';
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius * 1.15, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(231,76,60,0.9)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, char.radius * 1.15, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                if (char.name === '糖水') {
                    if (char.slashFx > 0) {
                        const progress = 1 - char.slashFx / 0.25;
                        const current = char.slashAngle - 0.6 + progress * 1.2;
                        const slashRange = char.slashRange || 45;
                        
                        ctx.strokeStyle = `rgba(230,126,34,${1 - progress})`;
                        ctx.lineWidth = 5;
                        ctx.beginPath();
                        ctx.arc(0, 0, slashRange * 0.9, char.slashAngle - 0.6, char.slashAngle + 0.6);
                        ctx.stroke();
                        
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(current) * slashRange, Math.sin(current) * slashRange);
                        ctx.stroke();
                    }
                    
                    for (const trail of char.dashTrail || []) {
                        ctx.fillStyle = `rgba(230,126,34,${(trail.life / 0.28) * 0.35})`;
                        ctx.fillRect(
                            trail.x - char.x - char.radius * 0.5,
                            trail.y - char.y - char.radius * 0.5,
                            char.radius,
                            char.radius
                        );
                    }
                    
                    if (char.armorTimer > 0) {
                        ctx.fillStyle = 'rgba(241,196,15,0.35)';
                        ctx.beginPath();
                        ctx.arc(0, 0, char.radius * 0.95, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.strokeStyle = 'rgba(241,196,15,0.9)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
                ctx.restore();
                }
            }
            
            for (const ft of floatingTexts) {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
            
            for (const char of characters) {
                if (char.hp <= 0) continue;
                // 变身中的模仿者由 currentForm.draw() 负责绘制名字/血量/蓄力条，避免重复绘制
                if (char.currentForm && char.isTransforming) continue;
                
                const nameY = char.y - char.radius - 5;
                const hpY = char.y - char.radius - 15;
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(char.name, char.x, nameY);
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Arial';
                ctx.fillText(`${Math.round(char.hp)}/${char.maxHp}`, char.x, hpY);
                
                // 邓杰的算式字幕（伤害数值即算式的计算结果，逐字敲出）
                if (char.isTyping && char.currentExpression) {
                    const typedText = char.currentExpression.substring(0, char.typingIndex + 1);
                    ctx.fillStyle = '#8e44ad';
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText(typedText + '|', char.x, char.y - char.radius - 26);
                } else if (char.expression && char.expressionUntil && Date.now() < char.expressionUntil) {
                    ctx.fillStyle = '#8e44ad';
                    ctx.font = 'bold 9px Arial';
                    ctx.fillText(char.expression, char.x, char.y - char.radius - 26);
                }
                
                if (char.chargeLevel !== undefined && char.maxCharge !== undefined) {
                    const chargeWidth = 40;
                    const chargeHeight = 6;
                    const chargeY = char.y - char.radius - 30;
                    
                    ctx.fillStyle = '#ddd';
                    ctx.fillRect(char.x - chargeWidth/2, chargeY, chargeWidth, chargeHeight);
                    ctx.fillStyle = '#f39c12';
                    ctx.fillRect(char.x - chargeWidth/2, chargeY, chargeWidth * (char.chargeLevel / char.maxCharge), chargeHeight);
                    
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText(`${char.chargeLevel}/${char.maxCharge}`, char.x, chargeY + 5);
                }
                
                if (char.bugCount && char.bugCount > 0) {
                    const bugY = char.y - char.radius - 30;
                    ctx.fillStyle = '#9b59b6';
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText(`漏洞: ${char.bugCount}`, char.x, bugY);
                }
                
                if (char.questions && char.questions > 0) {
                    const questionY = char.y - char.radius - 30;
                    ctx.fillStyle = '#00ffff';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('?' + '?'.repeat(char.questions - 1), char.x, questionY);
                }
                
                if (char.oxidationStacks > 0) {
                    ctx.fillStyle = '#9acd32';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`氧化 ${char.oxidationStacks}/5`, char.x, char.y - char.radius - 30);
                }
                
                if (char.name === 'Liberty' && char.isCloaked) {
                    const remain = Math.max(0, (char.cloakEndTime - Date.now()) / 1000);
                    ctx.fillStyle = 'rgba(155,89,182,1)';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`隐身 ${remain.toFixed(1)}s`, char.x, char.y - char.radius - 30);
                }
                
                if (char.sugarStacks > 0) {
                    ctx.fillStyle = '#e67e22';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`糖渍 ${char.sugarStacks}/4`, char.x, char.y - char.radius - 42);
                }
                
                if (char.isNagged) {
                    const nagY = char.y - char.radius - 45;
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('...', char.x, nagY);
                }
                
                if (char.isTyping && char.currentTypingCode) {
                    const typedText = char.currentTypingCode.substring(0, char.typingIndex + 1);
                    ctx.fillStyle = char.color;
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(typedText + '|', char.x, char.y - char.radius - 50);
                }
                
                // 陈智虫专属 UI：普通角色不走自身的 draw()，故在此统一绘制学习进度与状态
                if (char.name === '陈智虫') {
                    const learnY = char.y + char.radius + 14;
                    ctx.fillStyle = '#2ecc71';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`学${char.learnCount} 伤+${char.learnDamage}`, char.x, learnY);
                    
                    ctx.fillStyle = char.isLearning ? '#9b59b6' : '#e74c3c';
                    ctx.fillText(char.isLearning ? '学习中' : '战斗!', char.x, learnY + 12);
                }
            }
            
            if (immersiveMode) {
                ctx.restore();
            }
        }
        
        function update() {
            if (gameOver) return;
            
            for (const char of characters) {
                if (char.hp <= 0) continue;
                
                if (char.timeFieldEffect > 0) {
                    char.timeFieldEffect -= gameSpeed * deltaTime;
                }
                
                if (char.damageReduction > 0) {
                    char.damageReduction -= gameSpeed * deltaTime;
                }
                
                if (char.bugTimer && char.bugTimer > 0) {
                    char.bugTimer -= gameSpeed * deltaTime;
                    if (char.bugTimer <= 0) {
                        char.bugCount = Math.max(0, (char.bugCount || 0) - 1);
                        if (char.bugCount > 0) {
                            char.bugTimer = 10;
                        } else {
                            char.bugTimer = 0;
                        }
                    }
                }
                
                if (char.slowTimer && char.slowTimer > 0) {
                    char.slowTimer -= gameSpeed * deltaTime;
                    if (!char.slowApplied) {
                        char.slowApplied = true;
                        char.vx = char.vx * 0.5;
                        char.vy = char.vy * 0.5;
                        normalizeVelocity(char);
                    }
                    if (char.slowTimer <= 0) {
                        char.slowTimer = 0;
                        char.slowApplied = false;
                        char.vx = char.vx / 0.5;
                        char.vy = char.vy / 0.5;
                        normalizeVelocity(char);
                    }
                } else {
                    char.slowApplied = false;
                }
                
                if (char.stunTimer && char.stunTimer > 0) {
                    char.stunTimer -= gameSpeed * deltaTime;
                    char.vx = 0;
                    char.vy = 0;
                    if (char.stunTimer <= 0) {
                        char.stunTimer = 0;
                        const angle = Math.random() * Math.PI * 2;
                        char.vx = Math.cos(angle) * (char.speed || BASE_SPEED);
                        char.vy = Math.sin(angle) * (char.speed || BASE_SPEED);
                    }
                }
                
                if (char.punishTimer && char.punishTimer > 0) {
                    char.punishTimer -= gameSpeed * deltaTime;
                    
                    if (char.punishTarget && char.punishTarget.hp > 0) {
                        const orbitRadius = 80;
                        const moveDist = (char.speed || BASE_SPEED) * 1.5 * gameSpeed * deltaTime * 60;
                        const angleIncrement = moveDist / orbitRadius;
                        char.punishStartAngle += angleIncrement;
                        
                        const newX = char.punishTarget.x + Math.cos(char.punishStartAngle) * orbitRadius;
                        const newY = char.punishTarget.y + Math.sin(char.punishStartAngle) * orbitRadius;
                        
                        char.x = newX;
                        char.y = newY;
                        clampToBounds(char);
                        
                        const actualDx = char.x - char.punishLastX;
                        const actualDy = char.y - char.punishLastY;
                        const actualMoveDist = Math.min(
                            Math.sqrt(actualDx * actualDx + actualDy * actualDy),
                            moveDist
                        );
                        
                        char.punishLastX = char.x;
                        char.punishLastY = char.y;
                        char.vx = 0;
                        char.vy = 0;
                        
                        char.punishRunDistance += actualMoveDist;
                        
                        while (char.punishRunDistance >= 60) {
                            char.punishRunDistance -= 60;
                            const damage = 30;
                            char.hp -= damage;
                            showDamageText(char, damage, '#e74c3c', char.punishTarget);
                            if (char.hp <= 0) {
                                char.hp = 0;
                            }
                        }
                    }
                    
                    if (char.punishTimer <= 0) {
                        char.punishTimer = 0;
                        char.punishTarget = null;
                        char.punishStartAngle = 0;
                        char.punishRunDistance = 0;
                        char.punishLastX = 0;
                        char.punishLastY = 0;
                        const angle = Math.random() * Math.PI * 2;
                        char.vx = Math.cos(angle) * (char.speed || BASE_SPEED);
                        char.vy = Math.sin(angle) * (char.speed || BASE_SPEED);
                    }
                }
            }
            
            for (const char of characters) {
                // 罚跑压制：被罚跑的角色攻击与技能的使用速度下降
                if (char.punishTimer > 0) {
                    const savedGameSpeed = gameSpeed;
                    gameSpeed = savedGameSpeed * PUNISH_ACTION_SPEED_FACTOR;
                    char.update(characters, projectiles, floatingTexts);
                    gameSpeed = savedGameSpeed;
                } else {
                    char.update(characters, projectiles, floatingTexts);
                }
            }
            
            resolveSameTeamCollisions();
            
            const questionNow = Date.now();
            for (const char of characters) {
                if (char.hp <= 0) continue;
                
                if (char.questions && char.questions > 0) {
                    if (questionNow - char.lastQuestionTime >= 2000 / gameSpeed) {
                        const damage = char.questions * 15;
                        char.hp -= damage;
                        
                        const owner = characters.find(c => c.name === '陈智虫' && c.team !== char.team);
                        showDamageText(char, damage, '#9b59b6', owner || null);
