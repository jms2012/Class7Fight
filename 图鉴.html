<html lang="zh-CN">

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 15%, #5b7fe8 0%, #4169E1 48%, #3152b8 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #333;
            padding: 24px 20px 40px;
        }
        .page-shell {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding: 22px 26px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 18px;
            box-shadow: 0 14px 38px rgba(0, 0, 0, 0.18);
        }
        .page-header h1 {
            color: #e74c3c;
            font-size: 30px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }
        .back-link {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 999px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(231, 76, 60, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(231, 76, 60, 0.42);
        }
        .tab-bar {
            display: flex;
            gap: 8px;
            align-self: flex-start;
            padding: 6px;
            background: rgba(255, 255, 255, 0.82);
            border-radius: 14px;
        }
        .tab-btn {
            border: none;
            background: transparent;
            color: #555;
            font-size: 14px;
            font-weight: 700;
            padding: 9px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: #f0f2f7; }
        .tab-btn.active {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            box-shadow: 0 6px 14px rgba(231, 76, 60, 0.3);
        }
        .tab-panel {
            display: none;
            padding: 18px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .tab-panel.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: none; }
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 2px 6px 8px;
        }
        .panel-head h2 {
            color: #fff;
            font-size: 20px;
        }
        .panel-note {
            padding: 0 6px 14px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            line-height: 1.6;
        }
        .count-badge {
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            color: #4169E1;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .codex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 16px;
            align-items: start;
        }
        .codex-card {
            display: flex;
            flex-direction: column;
            padding: 18px;
            background: #fff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            box-shadow: 0 8px 22px rgba(19, 42, 96, 0.16);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .codex-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(19, 42, 96, 0.24);
        }
        .codex-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .avatar {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
        }
        .codex-name {
            color: #23324d;
            font-size: 17px;
            font-weight: 800;
        }
        .role-tag {
            display: inline-block;
            margin-top: 5px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }
        .summary {
            margin: 2px 0 12px;
            padding: 8px 10px;
            border-left: 3px solid #dfe6f3;
            background: #f7f9fc;
            border-radius: 0 8px 8px 0;
            color: #3f4b5f;
            font-size: 13px;
            line-height: 1.65;
        }
        .stat-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .stat-chip {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 8px;
            background: #eef3fb;
            border: 1px solid #dce6f5;
            font-size: 11px;
            color: #5b6b82;
            white-space: nowrap;
        }
        .stat-chip b {
            color: #23324d;
            font-size: 12px;
        }
        .block {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #e3e9f2;
        }
        .block-title {
            display: inline-block;
            margin-bottom: 5px;
            padding: 2px 8px;
            border-radius: 6px;
            background: #f4f6fa;
            color: #34495e;
            font-size: 12px;
            font-weight: 800;
        }
        .block-text {
            color: #4b5563;
            font-size: 13px;
            line-height: 1.72;
        }
        .block-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .block-list li {
            position: relative;
            padding-left: 14px;
            color: #4b5563;
            font-size: 13px;
            line-height: 1.68;
        }
        .block-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #9fb2d1;
        }
        .block-list strong {
            color: #2c3e50;
            font-weight: 800;
        }
        .key-nums {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 14px;
            padding-top: 11px;
            border-top: 1px dashed #e3e9f2;
        }
        .key-num {
            padding: 4px 9px;
            border-radius: 999px;
            background: #fdf2e9;
            border: 1px solid #f5d7b8;
            color: #b9770e;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        .tone-red .avatar { background: linear-gradient(135deg, #ff7b6b, #c0392b); }
        .tone-red .role-tag { background: #fdecea; color: #c0392b; border: 1px solid #f5b7b1; }
        .tone-blue .avatar { background: linear-gradient(135deg, #6bb6ff, #2471a3); }
        .tone-blue .role-tag { background: #eaf3fb; color: #2471a3; border: 1px solid #aed6f1; }
        .tone-purple .avatar { background: linear-gradient(135deg, #b07cd8, #7d3c98); }
        .tone-purple .role-tag { background: #f4ecf7; color: #7d3c98; border: 1px solid #d7bde2; }
        .tone-orange .avatar { background: linear-gradient(135deg, #f5b041, #b9770e); }
        .tone-orange .role-tag { background: #fef5e7; color: #b9770e; border: 1px solid #fad7a0; }
        .tone-green .avatar { background: linear-gradient(135deg, #52c98a, #1e8449); }
        .tone-green .role-tag { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }

            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .changelog-group {
            padding: 18px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 22px rgba(19, 42, 96, 0.16);
        }

            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .log-date {
            color: #23324d;
            font-size: 15px;
            font-weight: 800;
        }
        .latest-badge {
            padding: 3px 8px;
            border-radius: 999px;
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .log-entry {
            padding: 0 0 14px 14px;
            border-left: 3px solid #dfe6f3;
        }
        .log-entry:last-child { padding-bottom: 0; }
        .log-title {
            margin-bottom: 6px;
            color: #2c3e50;
            font-size: 14px;
            font-weight: 800;
        }
        .log-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
            list-style: none;
        }
        .log-items li {
            position: relative;
            padding-left: 14px;
            color: #4b5563;
            font-size: 13px;
            line-height: 1.6;
        }
        .log-items li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 7px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #e74c3c;
            opacity: 0.75;
        }
        .page-footer {
            padding-top: 6px;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
        }
        @media (max-width: 900px) {
            .codex-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 720px) {
            body { padding: 16px 12px 28px; }
            .page-header {
                flex-direction: column;
                align-items: stretch;
                padding: 18px;
            }
            .page-header h1 { font-size: 24px; }
            .back-link { align-self: flex-start; }
            .tab-bar { align-self: stretch; }
            .tab-btn {
                flex: 1;
                padding: 9px 10px;
            }
            .tab-panel { padding: 12px; }
            .codex-card { padding: 15px; }
        }
    </style>
</head>

        </main>

        <footer class="page-footer">猎7班大乱斗 · 图鉴与更新日志</footer>

        function renderCodex() {
            const grid = document.getElementById('codexGrid');
            grid.innerHTML = CODEX_ENTRIES.map(entry => {
                const stats = entry.stats.map(stat => `
                    <span class="stat-chip">${stat.label}<b>${stat.value}</b></span>
                `).join('');

                const blocks = entry.blocks.map(block => {
                    if (block.items) {
                        return `
                            <div class="block">
                                <span class="block-title">${block.title}</span>
                                <ul class="block-list">
                                    ${block.items.map(item => `<li><strong>${item.name}</strong>${item.detail}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }
                    return `
                        <div class="block">
                            <span class="block-title">${block.title}</span>
                            <p class="block-text">${block.text}</p>
                        </div>
                    `;
                }).join('');

                const keyNums = entry.keyNums.map(num => `<span class="key-num">${num}</span>`).join('');

                return `
                    <article class="codex-card tone-${entry.tone}">
                        <div class="codex-top">
                            <div class="avatar">${entry.icon}</div>
                            <div>
                                <div class="codex-name">${entry.name}</div>
                                <span class="role-tag">${entry.role}</span>
                            </div>
                        </div>
                        <p class="summary">${entry.summary}</p>
                        <div class="stat-row">${stats}</div>
                        ${blocks}
                        <div class="key-nums">${keyNums}</div>
                    </article>
                `;
            }).join('');
        }

        function renderChangelog() {
            const list = document.getElementById('changelogList');
            list.innerHTML = CHANGELOG_GROUPS.map((group, index) => `
                <section class="changelog-group">
                    <div class="log-date-row">
                        <span class="log-date">${group.date}</span>
                        ${index === 0 ? '<span class="latest-badge">最新</span>' : ''}
                    </div>
                    ${group.entries.map(entry => `
                        <div class="log-entry">
                            <div class="log-title">${entry.title}</div>
                            <ul class="log-items">
                                ${entry.items.map(item => `<li>${item}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('')}
                </section>
            `).join('');
        }

        function switchTab(tab) {
            const isChangelog = tab === 'changelog';
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            document.getElementById('codexPanel').classList.toggle('active', !isChangelog);
            document.getElementById('changelogPanel').classList.toggle('active', isChangelog);

            try {
                history.replaceState(null, '', isChangelog ? '#changelog' : '#codex');
            } catch (e) {
                // 某些本地 file:// 环境可能不允许修改 history，忽略即可
            }
        }

        renderCodex();
        renderChangelog();
        switchTab(location.hash === '#changelog' ? 'changelog' : 'codex');
    </script>
